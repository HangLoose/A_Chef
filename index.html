<title>A_Chef — Товары · Меню · Движение · Поставщики · Себестоимость</title>
<style>
/* ===== 00-root.css ===== */
/* ============================================================
   A_Chef · 00-root.css
   (c) 2026 Дмитрий Князев. Все права защищены.
   Базовый слой: Темная тема (Dark Mode) с зелеными акцентами.
   ============================================================ */

:root {
  color-scheme: dark; /* Включает темные системные скроллбары и календари */
  
  /* Глубокие графитовые фоны */
  --bg-app: #0f172a;          /* Самый темный фон */
  --bg-panel: #1e293b;        /* Фон панелей (чуть светлее) */
  --bg-toolbar: #0f172a;      /* Тулбар */
  --bg-grid-header: #334155;  /* Заголовки таблиц */

  /* Светлый текст для чтения на темном фоне */
  --text-main: #f8fafc;       
  --text-muted: #94a3b8;      

  /* Границы */
  --border: #475569;          
  --border-light: #334155;    
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);

  /* Изумрудные (зеленые) акценты */
  --active-blue: #064e3b;     /* Темно-зеленый фон при выборе */
  --active-text: #34d399;     /* Яркий зеленый текст */
  --active-border: #10b981;   /* Зеленая рамка */

  --accent-green: #34d399;
  --accent-green-bg: #064e3b;
  --accent-red: #f87171;
  --accent-red-bg: #7f1d1d;
  --accent-orange: #fb923c;
  --accent-orange-bg: #7c2d12;
  --accent-purple: #c084fc;
  --accent-gold: #fbbf24;

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font);
  font-size: 12px;
  background: var(--bg-app);
  color: var(--text-main);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

input,
textarea,
select {
  user-select: text;
  font-family: inherit;
}

input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

input[type=number] {
  -moz-appearance: textfield;
}

.col-center { text-align: center; }
.col-right {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.empty-state {
  padding: 40px;
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
}

.hint {
  padding: 8px 12px;
  margin: 12px 16px;
  background: var(--bg-panel);
  border-left: 3px solid var(--active-border);
  border-radius: 4px;
  font-size: 11.5px;
  color: var(--text-muted);
  line-height: 1.5;
}
.hint b { color: var(--active-text); }
.hint.warn { border-left-color: var(--accent-orange); background: var(--accent-orange-bg); color: #fdba74; }
.hint.danger { border-left-color: var(--accent-red); background: var(--accent-red-bg); color: #fca5a5; }

/* Исправляем цвета иконок и полей ввода в темной теме */
input, select, textarea {
  background: var(--bg-app);
  color: var(--text-main);
  border: 1px solid var(--border);
}

/* ===== 10-layout.css ===== */
/* ============================================================
   A_Chef · 10-layout.css
   (c) 2026 Дмитрий Князев. Все права защищены.
   Каркас: тулбар, sidebar, main-area. Темная тема.
   ============================================================ */

/* ===== TOOLBAR ===== */
.toolbar {
  height: 44px;
  background: var(--bg-toolbar);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 4px;
  z-index: 100;
}
.tool-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px;
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-main);
  transition: all 0.2s ease;
}
.tool-btn:hover {
  background: var(--bg-panel);
  border-color: var(--border);
}
.tool-btn:active {
  background: var(--bg-grid-header);
}
.tool-btn .icon {
  font-size: 14px;
}
.tool-sep {
  width: 1px;
  height: 20px;
  background: var(--border);
  margin: 0 6px;
}

/* ===== WORKSPACE ===== */
.workspace {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ===== SIDEBAR ===== */
.sidebar {
  width: 230px;
  background: var(--bg-panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  padding: 8px 4px;
}
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 3px;
}

/* ===== TREE ===== */
.tree-node {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 8px;
  cursor: pointer;
  border-radius: 4px;
  margin-bottom: 1px;
  color: var(--text-main);
  font-size: 12px;
  transition: all 0.15s ease;
}
.tree-node:hover { background: var(--bg-grid-header); }
.tree-node.active {
  background: var(--active-blue);
  color: var(--active-text);
  font-weight: 600;
}
.tree-node.root {
  font-weight: 600;
  margin-top: 6px;
}
.tree-node.child { padding-left: 24px; }
.tree-arrow {
  font-size: 9px;
  width: 12px;
  text-align: center;
  color: var(--text-muted);
}
.tree-icon {
  font-size: 14px;
  color: var(--accent-gold);
}
.tree-icon.blue { color: #60a5fa; }
.tree-icon.purple { color: var(--accent-purple); }
.tree-icon.orange { color: var(--accent-orange); }
.tree-icon.green { color: var(--accent-green); }
.tree-count {
  margin-left: auto;
  font-size: 10px;
  font-weight: 600;
  color: var(--text-muted);
  background: var(--bg-app);
  padding: 1px 6px;
  border-radius: 10px;
}
.tree-node.active .tree-count {
  background: var(--accent-green);
  color: #000;
}

/* ===== MAIN AREA ===== */
.main-area {
  flex: 1;
  background: var(--bg-app);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ===== TABLE TOP BAR ===== */
.table-top-bar {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-app);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.table-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-main);
}
.table-sub {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* ===== SEARCH INPUT ===== */
.search-input {
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 12px;
  width: 220px;
  background: var(--bg-panel);
  color: var(--text-main);
  transition: all 0.2s;
}
.search-input:focus {
  outline: none;
  border-color: var(--active-border);
  box-shadow: 0 0 0 2px var(--active-blue);
}

/* ===== FILTER TABS ===== */
.filter-tabs {
  display: flex;
  gap: 6px;
  border-bottom: 1px solid var(--border);
  padding: 8px 16px;
  background: var(--bg-app);
}
.filter-tab {
  padding: 4px 12px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.2s;
}
.filter-tab:hover {
  background: var(--bg-grid-header);
  color: var(--text-main);
}
.filter-tab.active {
  background: var(--active-blue);
  color: var(--active-text);
  border-color: var(--active-border);
  font-weight: 600;
}

/* ===== TABLE SCROLL WRAPPER ===== */
.table-scroll {
  flex: 1;
  overflow: auto;
}

/* ===== STATUS BAR ===== */
.status-bar {
  height: 24px;
  background: var(--bg-panel);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  font-size: 11px;
  color: var(--text-muted);
}
.status-left {
  display: flex;
  gap: 16px;
  font-weight: 500;
}
.copyright {
  font-weight: 500;
}

/* ===== 20-grid.css ===== */
/* ============================================================
   A_Chef · 20-grid.css
   (c) 2026 Дмитрий Князев. Все права защищены.
   Таблицы, бейджи. Темная тема с зеленым акцентом.
   ============================================================ */

/* ===== ОСНОВНАЯ ТАБЛИЦА ===== */
.data-grid {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
}
.data-grid th {
  background: var(--bg-grid-header);
  border: 1px solid var(--border);
  padding: 6px 10px;
  font-weight: 600;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: #e2e8f0;
  position: sticky;
  top: 0;
  z-index: 10;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}
.data-grid th:hover { background: #475569; }
.data-grid th.no-sort { cursor: default; }
.data-grid th.no-sort:hover { background: var(--bg-grid-header); }

.data-grid td {
  border: 1px solid var(--border);
  padding: 4px 10px;
  font-size: 12px;
  vertical-align: middle;
  color: var(--text-main);
  white-space: nowrap;
  background: var(--bg-app);
}
.data-grid tr:hover td { background: var(--bg-panel); }
.data-grid tr.selected td { background: var(--active-blue); color: var(--active-text); font-weight: 600; }

/* ===== БЕЙДЖИ ===== */
.pf-badge {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 10px;
  font-size: 9px;
  font-weight: 700;
  margin-left: 4px;
  background: var(--accent-orange-bg);
  color: var(--accent-orange);
  border: 1px solid var(--accent-orange);
}
.noprice-badge {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 10px;
  font-size: 9px;
  font-weight: 700;
  margin-left: 4px;
  background: var(--accent-red-bg);
  color: var(--accent-red);
  border: 1px solid var(--accent-red);
}

.fc-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 700;
}
.fc-good { background: var(--accent-green-bg); color: var(--accent-green); border: 1px solid var(--active-border); }
.fc-bad { background: var(--accent-red-bg); color: var(--accent-red); border: 1px solid var(--accent-red); }
.fc-warn { background: var(--accent-orange-bg); color: var(--accent-orange); border: 1px solid var(--accent-orange); }
.fc-neutral { background: var(--bg-panel); color: var(--text-muted); border: 1px solid var(--border); }

/* ===== СТАТУСЫ ОСТАТКОВ ===== */
.stock-cell { font-weight: 600; }
.stock-cell.zero { color: var(--accent-red); }
.stock-cell.negative { color: var(--accent-red); font-weight: 800; }

/* ===== КНОПКИ В СТРОКАХ ===== */
.row-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 4px;
  background: var(--bg-panel);
  color: var(--text-muted);
  font-size: 12px;
  cursor: pointer;
  border: 1px solid var(--border);
  transition: all 0.2s;
}
.row-btn:hover {
  background: var(--bg-grid-header);
  color: var(--text-main);
}
.row-btn.red:hover { background: var(--accent-red); color: #fff; border-color: var(--accent-red); }
.row-btn.green:hover { background: var(--accent-green); color: #000; border-color: var(--accent-green); }
.row-btn.orange:hover { background: var(--accent-orange); color: #fff; border-color: var(--accent-orange); }
.row-btn.purple:hover { background: var(--accent-purple); color: #fff; border-color: var(--accent-purple); }

/* ===== 30-modal.css ===== */
/* ============================================================
   A_Chef · 30-modal.css
   (c) 2026 Дмитрий Князев. Все права защищены.
   Модальные окна, кнопки, поля ввода, уведомления (toast).
   ============================================================ */

/* ===== МОДАЛЬНЫЕ ОКНА ===== */
.modal-backdrop {
  display: none;
  position: fixed !important;
  top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
  width: 100vw; height: 100vh;
  z-index: 10000;
  background: rgba(0, 0, 0, 0.7); /* Темнее фон */
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal-backdrop.open { display: flex !important; }

.modal {
  width: 100%;
  max-width: 560px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  max-height: 90vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
}
.modal.wide { max-width: 900px; }
.modal.xwide { max-width: 1100px; }

.modal-head {
  padding: 12px 16px;
  background: var(--bg-toolbar);
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-head h3 { font-size: 14px; font-weight: bold; color: var(--text-main); }

.modal-close {
  width: 24px; height: 24px;
  border-radius: 4px;
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-muted);
  font-size: 18px;
  cursor: pointer;
  font-weight: bold;
}
.modal-close:hover { background: var(--bg-grid-header); color: var(--text-main); }

.modal-body {
  padding: 16px;
  overflow-y: auto;
  flex: 1;
  background: var(--bg-app);
}

.modal-foot {
  padding: 12px 16px;
  background: var(--bg-toolbar);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

/* ===== КНОПКИ ===== */
.btn {
  padding: 6px 14px;
  border-radius: 6px;
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--bg-panel);
  color: var(--text-main);
  transition: all 0.2s;
}
.btn:hover { background: var(--bg-grid-header); }
.btn.primary {
  background: var(--active-border);
  color: #000;
  border-color: var(--active-border);
  font-weight: 600;
}
.btn.primary:hover { background: var(--active-text); color: #fff; }
.btn.danger {
  color: var(--accent-red);
  border-color: var(--accent-red);
}
.btn.danger:hover {
  background: var(--accent-red);
  color: #fff;
}

/* ===== ПОЛЯ ВВОДА В МОДАЛКАХ ===== */
.modal-field { margin-bottom: 12px; }
.modal-field label {
  display: block;
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 4px;
  font-weight: bold;
}
.modal-field input,
.modal-field textarea,
.modal-field select {
  width: 100%;
  padding: 8px 12px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-main);
  font-family: inherit;
  font-size: 12px;
}
.modal-field input:focus,
.modal-field textarea:focus,
.modal-field select:focus {
  outline: none;
  border-color: var(--active-border);
}
.modal-field-hint {
  font-size: 10.5px;
  color: var(--text-muted);
  margin-top: 4px;
  line-height: 1.4;
}

/* ===== УВЕДОМЛЕНИЯ (TOAST) ===== */
.toast {
  position: fixed;
  bottom: 40px; right: 20px;
  z-index: 20000;
  padding: 12px 20px;
  border-radius: 6px;
  background: var(--bg-grid-header);
  color: var(--text-main);
  font-size: 13px;
  font-weight: bold;
  border: 1px solid var(--border);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
  transform: translateY(100px);
  opacity: 0;
  transition: all 0.25s;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.success { background: var(--accent-green-bg); color: var(--accent-green); border-color: var(--accent-green); }
.toast.error { background: var(--accent-red-bg); color: var(--accent-red); border-color: var(--accent-red); }

/* ===== 40-hero.css ===== */
/* ============================================================
   A_Chef · 40-hero.css
   (c) 2026 Дмитрий Князев. Все права защищены.
   Шапки деталей (hero), вкладки, статистика движения, поставщики.
   ============================================================ */

/* ===== ДЕТАЛИ ТОВАРА/БЛЮДА ===== */
.good-detail-wrap { display: flex; flex-direction: column; height: 100%; overflow: hidden; }

.good-hero {
  padding: 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-panel);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.good-hero .gh-name { font-size: 18px; font-weight: bold; color: var(--text-main); }
.good-hero .gh-meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.good-hero .gh-meta b { color: var(--active-text); }
.good-hero .gh-avg { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.good-hero .gh-avg .lbl { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); font-weight: bold; }
.good-hero .gh-avg .val { font-size: 24px; font-weight: bold; color: var(--active-text); }
.good-hero .gh-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg-panel);
  font-family: inherit;
  font-size: 12px;
  font-weight: bold;
  color: var(--text-main);
  cursor: pointer;
  margin: 16px;
}
.back-btn:hover { background: var(--bg-grid-header); }

/* ===== СТАТИСТИКА ДВИЖЕНИЯ ===== */
.movement-summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  padding: 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-app);
}
.mv-stat {
  padding: 12px 16px;
  border-radius: 6px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
}
.mv-stat .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); font-weight: bold; margin-bottom: 4px; }
.mv-stat .val { font-size: 18px; font-weight: bold; color: var(--text-main); }

.mv-stat.in { border-color: var(--accent-green); }
.mv-stat.in .val { color: var(--accent-green); }
.mv-stat.out { border-color: var(--accent-red); }
.mv-stat.out .val { color: var(--accent-red); }
.mv-stat.balance { border-color: var(--active-border); }
.mv-stat.balance .val { color: var(--active-text); }

.mv-type {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: .5px;
}
.mv-type.in { background: var(--accent-green-bg); color: var(--accent-green); border: 1px solid var(--accent-green); }
.mv-type.out { background: var(--accent-red-bg); color: var(--accent-red); border: 1px solid var(--accent-red); }
.mv-type.adjust { background: #1e3a8a; color: #93c5fd; border: 1px solid #3b82f6; }

/* ===== ПОСТАВЩИКИ ===== */
.sup-card {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg-panel);
  margin-bottom: 8px;
  cursor: pointer;
}
.sup-card:hover { background: var(--bg-grid-header); border-color: var(--active-border); }
.sup-card-name { font-weight: bold; font-size: 14px; color: var(--text-main); }
.sup-card-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.sup-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: bold;
  margin-right: 4px;
}
.sup-badge.best { background: var(--accent-green-bg); color: var(--accent-green); }

const $ = (s, r) => (r || document).querySelector(s);

function debounce(fn, delay) {
  let timer = null;
  return function(...args) {
    clearTimeout(timer);
    timer = setTimeout(() => fn.apply(this, args), delay);
  };
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function uid(p){ return (p || 'id') + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7); }
function todayISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function todayRU(){
  const d = new Date();
  return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear();
}
function fmt2(n){ return (n == null || n === '') ? '—' : (+n).toFixed(2).replace('.', ','); }
function fmt3(n){ return (n == null || n === '') ? '—' : (+n).toFixed(3).replace('.', ','); }
function fmt4(n){ return (n == null || n === '') ? '—' : (+n).toFixed(4).replace('.', ','); }
function round3(n){ return Math.round((+n || 0) * 1000) / 1000; }

function plural(n, one, few, many){
  const a = n % 10, b = n % 100;
  if(a === 1 && b !== 11) return one;
  if(a >= 2 && a <= 4 && (b < 10 || b >= 20)) return few;
  return many;
}

function download(filename, content, mime){
  const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 500);
}

function goodCookLoss(g){
  const v = (g && g.cookLoss) || 0;
  return Math.max(0, Math.min(99.99, v));
}
function calcBruttoFromNetto(netto, wastePct){
  const k = 1 - wastePct / 100;
  return k > 0.0001 ? round3(netto / k) : 0;
}
function calcNettoFromBrutto(brutto, wastePct){
  return round3(brutto * (1 - wastePct / 100));
}
function calcFinalFromNetto(netto, cookPct){
  return round3(netto * (1 - cookPct / 100));
}
function calcNettoFromFinal(final, cookPct){
  const k = 1 - cookPct / 100;
  return k > 0.0001 ? round3(final / k) : 0;
}
function calcBruttoFromFinal(final, wastePct, cookPct){
  const k1 = 1 - wastePct / 100, k2 = 1 - cookPct / 100;
  return (k1 > 0.0001 && k2 > 0.0001) ? round3(final / k1 / k2) : 0;
}

      if(f.type === 'textarea') return `<div class="modal-field"><label>${esc(f.label)}</label><textarea id="${id}" rows="${f.rows || 3}">${esc(f.value || '')}</textarea></div>`;
      if(f.type === 'select'){

        return `<div class="modal-field"><label>${esc(f.label)}</label><select id="${id}">${o}</select></div>`;

function loadDB(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const p = JSON.parse(raw);
      if(p && p.goods && p.categories) return p;
    }
  } catch(e){ console.error('[loadDB]', e); }
  return null;
}

let _saveTimer = null;
function saveDB(immediate = false){
  if(!DB) return;
  DB.lastModified = new Date().toISOString();
  DB.appVersion = APP_VERSION;
  DB._schemaVersion = SCHEMA_VERSION;

  if (immediate) {
    if (_saveTimer) { clearTimeout(_saveTimer); _saveTimer = null; }
    _writeDBToLocalStorage();
  } else {
    if (_saveTimer) clearTimeout(_saveTimer);
    _saveTimer = setTimeout(() => {
      _writeDBToLocalStorage();
      _saveTimer = null;
    }, 300);
  }
}

function _writeDBToLocalStorage() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }
  catch(e){ console.error('[saveDB]', e); toast('Ошибка сохранения', 'error'); }
}

window.addEventListener('beforeunload', () => {
  if (_saveTimer) saveDB(true);
});

function defaultCookLoss(category){
  if(category === 'beef' || category === 'pork' || category === 'lamb') return 30;
  if(category === 'poultry') return 30;
  if(category === 'fish') return 20;
  if(category === 'seafood') return 15;
  if(category === 'vegetables') return 5;
  if(category === 'grocery') return 10;
  if(category === 'frozen-vegetables') return 10;
  if(category === 'frozen-meat' || category === 'frozen-poultry') return 25;
  if(category === 'frozen-fish' || category === 'frozen-seafood') return 15;
  return 0;
}

   Бизнес-логика: поиск, цены, себестоимость, склад (FIFO), заказы.

function getGoodCat(id){ return DB.categories.find(c => c.id === id) || { id, title:'Прочее', icon:'📦' }; }
function getMenuCat(id){ return (DB.menuCategories || []).find(c => c.id === id) || { id, title:'Прочее', icon:'🍽' }; }
function getGood(id){ return DB.goods.find(g => g.id === id); }
function getGoodByName(n){ return DB.goods.find(g => g.name === n); }
function getDish(id){ return (DB.dishes || []).find(d => d.id === id); }
function getOrder(id){ return (DB.orders || []).find(o => o.id === id); }

// ==== СКЛАД (Партии и FIFO) ====

function getActiveBatches(goodId){
  return (DB.batches || []).filter(b => b.goodId === goodId && b.remainingQty > 0).sort((a,b) => a.date.localeCompare(b.date));
}

function currentStock(goodId){
  const batches = getActiveBatches(goodId);
  const qty = batches.reduce((sum, b) => sum + b.remainingQty, 0);
  return Math.round(qty * 1000) / 1000;
}

function currentStockValue(goodId){
  const batches = getActiveBatches(goodId);
  return batches.reduce((sum, b) => sum + (b.remainingQty * b.price), 0);
}

// Списание по FIFO (возвращает реальную себестоимость списания)
function consumeFIFO(goodId, qtyToConsume){
  let remaining = qtyToConsume;
  let cost = 0;
  const batches = getActiveBatches(goodId);
  
  for (const b of batches) {
    if (remaining <= 0) break;
    const take = Math.min(b.remainingQty, remaining);
    b.remainingQty = Math.round((b.remainingQty - take) * 1000) / 1000;
    remaining = Math.round((remaining - take) * 1000) / 1000;
    cost += take * b.price;
  }
  return cost;
}

// ==== ЦЕНЫ И СЕБЕСТОИМОСТЬ ====

function avgPrice(good){
  if(!good) return 0;
  
  const batches = getActiveBatches(good.id);
  if(batches.length > 0) {
    const totalQty = batches.reduce((s, b) => s + b.remainingQty, 0);
    const totalVal = batches.reduce((s, b) => s + (b.remainingQty * b.price), 0);
    if (totalQty > 0) return totalVal / totalQty;
  }

  if(good.isPF){
    const self = (good.prices || []).find(p => p.supplier === SUPPLIER_SELF && p.price > 0);
    if(self) return self.price;
  }
  const manual = (good.prices || []).find(p => p.supplier === SUPPLIER_MANUAL && p.price > 0);
  if(manual) return manual.price;
  const valid = (good.prices || []).filter(p => p.price > 0 && p.supplier !== SUPPLIER_SELF && p.supplier !== SUPPLIER_MANUAL);
  if(!valid.length) return 0;
  return valid.reduce((s, p) => s + p.price, 0) / valid.length;
}

function minPrice(g){
  const v = (g.prices || []).filter(p => p.price > 0 && p.supplier !== SUPPLIER_SELF && p.supplier !== SUPPLIER_MANUAL);
  return v.length ? Math.min(...v.map(p => p.price)) : 0;
}
function maxPrice(g){
  const v = (g.prices || []).filter(p => p.price > 0 && p.supplier !== SUPPLIER_SELF && p.supplier !== SUPPLIER_MANUAL);
  return v.length ? Math.max(...v.map(p => p.price)) : 0;
}
function spreadOf(g){
  const mn = minPrice(g), mx = maxPrice(g);
  return (mn <= 0 || mx <= 0) ? 0 : Math.round((mx - mn) / mn * 1000) / 10;
}
function countPrices(g){
  return (g.prices || []).filter(p => p.price > 0 && p.supplier !== SUPPLIER_SELF && p.supplier !== SUPPLIER_MANUAL).length;
}

function recalcPF(){
  const pfs = DB.goods.filter(g => g.isPF);
  const resolved = new Set();
  for(let iter = 0; iter < 20; iter++){
    let progress = false;
    for(const pf of pfs){
      if(resolved.has(pf.id)) continue;
      let cost = 0, ok = true;
      if(pf.pfType === 'processing'){
        const parent = getGoodByName(pf.parentName);
        if(!parent || avgPrice(parent) <= 0) ok = false;
        else cost = avgPrice(parent) * (pf.coef || 1);
      } else if(pf.pfType === 'composite'){
        for(const line of (pf.lines || [])){
          const lg = getGoodByName(line.goodName);
          if(!lg || avgPrice(lg) <= 0){ ok = false; break; }
          cost += (line.brutto || 0) * avgPrice(lg);
        }
      } else ok = false;
      if(!ok) continue;
      pf.prices = (pf.prices || []).filter(p => p.supplier !== SUPPLIER_SELF);
      pf.prices.push({ supplier: SUPPLIER_SELF, price: Math.round(cost * 100) / 100, date: todayISO() });
      resolved.add(pf.id);
      progress = true;
    }
    if(!progress) break;
  }
}

/* ==================== РАСЧЁТ БЛЮД ==================== */
function ingQty(ing){
  return ing.brutto > 0 ? ing.brutto : (ing.netto || 0);
}
function ingCost(ing){
  const good = getGood(ing.goodId);
  if(!good) return 0;
  return ingQty(ing) * avgPrice(good);
}
function dishCost(dish){
  if(!dish) return 0;
  return (dish.ingredients || []).reduce((s, ing) => s + ingCost(ing), 0);
}
function dishFC(dish){
  if(!dish || !dish.price || dish.price <= 0) return null;
  const c = dishCost(dish);
  if(c <= 0) return null;
  return Math.round(c / dish.price * 1000) / 10;
}
function dishMarkup(dish){
  if(!dish || !dish.price || dish.price <= 0) return null;
  const c = dishCost(dish);
  if(c <= 0) return null;
  return Math.round((dish.price - c) / c * 1000) / 10;
}
function dishNetto(dish){
  if(!dish) return 0;
  return (dish.ingredients || []).reduce((s, ing) => {
    const good = getGood(ing.goodId);
    if(!good || !isWeightUnit(good.unit)) return s;
    return s + (ing.netto || 0);
  }, 0);
}
function dishBrutto(dish){
  if(!dish) return 0;
  return (dish.ingredients || []).reduce((s, ing) => {
    const good = getGood(ing.goodId);
    if(!good || !isWeightUnit(good.unit)) return s;
    return s + (ing.brutto || 0);
  }, 0);
}
function dishFinal(dish){
  if(!dish) return 0;
  return (dish.ingredients || []).reduce((s, ing) => {
    const good = getGood(ing.goodId);
    if(!good || !isWeightUnit(good.unit)) return s;
    return s + (ing.final || ing.netto || 0);
  }, 0);
}
function scaleDishToOutput(d){
  let sumFinal = 0;
  d.ingredients.forEach(ing => {
    const good = getGood(ing.goodId);
    if (good && isWeightUnit(good.unit)) {
      sumFinal += (ing.final || ing.netto || 0);
    }
  });
  if(sumFinal <= 0 || !d.output || d.output <= 0) return false;
  const target = d.output / 1000;
  if(Math.abs(sumFinal - target) < 0.001) return false;
  const k = target / sumFinal;
  d.ingredients.forEach(ing => {
    const good = getGood(ing.goodId);
    if (!good || !isWeightUnit(good.unit)) return;
    ing.brutto = round3(ing.brutto * k);
    ing.netto = round3(ing.netto * k);
    ing.final = round3(ing.final * k);
  });
  return true;
}
function fcClass(fc){
  if(fc == null) return 'fc-neutral';
  if(fc > 40) return 'fc-bad';
  if(fc > 30) return 'fc-warn';
  return 'fc-good';
}

/* ==================== ДВИЖЕНИЕ ==================== */
function movementStats(goodId){
  let inQty = 0, inSum = 0, outQty = 0, outSum = 0;
  (DB.movements || []).filter(m => m.goodId === goodId).forEach(m => {
    if(m.type === 'in'){ inQty += m.qty; inSum += m.total || 0; }
    else if(m.type === 'out'){ outQty += m.qty; outSum += m.total || 0; }
  });
  const stock = currentStock(goodId);
  const stockValue = currentStockValue(goodId);
  const avg = stock > 0 ? (stockValue / stock) : 0;
  return { inQty, inSum, outQty, outSum, stock, avg, stockValue };
}

/* ==================== ЗАКАЗЫ ==================== */
function nextOrderNumber() {
  if (!DB.orders || DB.orders.length === 0) return 1;
  const maxNum = Math.max(...DB.orders.map(o => o.number || 0));
  return maxNum + 1;
}

function calculateOrderTotals(order) {
  let total = 0, totalCost = 0;
  order.items.forEach(item => {
    total += item.price * item.qty;
    totalCost += item.cost * item.qty;
  });
  order.total = total;
  order.totalCost = totalCost;
}

/* ==================== ПОСТАВЩИКИ ==================== */
let _suppliersCache = null;
let _suppliersCacheTime = null;

function collectSuppliers(){
  if (_suppliersCache && _suppliersCacheTime === DB.lastModified) return _suppliersCache;
  
  const map = {};
  DB.goods.forEach(g => {
    (g.prices || []).forEach(p => {
      if(!p.supplier || p.price <= 0) return;
      if(p.supplier === SUPPLIER_SELF || p.supplier === SUPPLIER_MANUAL) return;
      if(!map[p.supplier]) map[p.supplier] = { name: p.supplier, goods: [], total: 0 };
      map[p.supplier].goods.push({ good: g, price: p.price });
      map[p.supplier].total += p.price;
    });
  });
  
  _suppliersCache = Object.values(map).sort((a, b) => b.total - a.total);
  _suppliersCacheTime = DB.lastModified;
  return _suppliersCache;
}

        state.section = 'suppliers'; state.isSuppliersOpen = true; state.selectedSupplier = null;
      }
      state.activeGoodsCat = null; state.selectedGoodId = null; state.activeMenuCat = null; state.selectedDishId = null;
    } else {
      state.section = nav;
      state.activeGoodsCat = null; state.activeMenuCat = null; state.selectedSupplier = null;
      state.selectedGoodId = null; state.selectedDishId = null;
    }
    state.searchQuery = '';
    render();
  }));
  $$('[data-goods-cat]').forEach(el => el.addEventListener('click', () => {
    state.section = 'goods';
    state.isGoodsOpen = true;
    state.activeGoodsCat = el.dataset.goodsCat;
    state.selectedSupplier = null;
    state.selectedGoodId = null;
    state.selectedDishId = null;
    render();
  }));
  $$('[data-menu-cat]').forEach(el => el.addEventListener('click', () => {
    state.section = 'menu';
    state.isMenuOpen = true;
    state.activeMenuCat = el.dataset.menuCat;
    state.activeGoodsCat = null;
    state.selectedGoodId = null;
    state.selectedDishId = null;
    render();
  }));
  $$('[data-sup]').forEach(el => el.addEventListener('click', () => {
    state.section = 'suppliers';
    state.isSuppliersOpen = true;
    state.selectedSupplier = el.dataset.sup;
    state.activeGoodsCat = null;
    state.activeMenuCat = null;
    state.selectedGoodId = null;
    state.selectedDishId = null;
    render();
  }));

  updateSidebarActive();
}

function updateSidebarActive() {
  if (!DB) return;
  $$('#sidebar .tree-node').forEach(el => el.classList.remove('active'));

  if (state.section === 'menu') {
    if (state.selectedDishId) {
    } else if (state.activeMenuCat) {
       const el = $(`#sidebar [data-menu-cat="${state.activeMenuCat}"]`);
       if (el) el.classList.add('active');
    } else {
       const el = $('#sidebar [data-nav="menu"]');
       if (el) el.classList.add('active');
    }
  } else if (state.section === 'goods') {
    if (state.selectedGoodId) {
    } else if (state.activeGoodsCat) {
       const el = $(`#sidebar [data-goods-cat="${state.activeGoodsCat}"]`);
       if (el) el.classList.add('active');
    } else {
       const el = $('#sidebar [data-nav="goods"]');
       if (el) el.classList.add('active');
    }
  } else if (state.section === 'suppliers') {
    if (state.selectedSupplier) {
       const el = $(`#sidebar [data-sup="${CSS.escape(state.selectedSupplier)}"]`);
       if (el) el.classList.add('active');
    } else {
       const el = $('#sidebar [data-nav="suppliers"]');
       if (el) el.classList.add('active');
    }
  } else if (state.section === 'movement') {
     const el = $('#sidebar [data-nav="movement"]');
     if (el) el.classList.add('active');
  } else if (state.section === 'variance') {
     const el = $('#sidebar [data-nav="variance"]');
     if (el) el.classList.add('active');
  } else if (state.section === 'cost') {
     const el = $('#sidebar [data-nav="cost"]');
     if (el) el.classList.add('active');
  } else if (state.section === 'dashboard') {
     const el = $('#sidebar [data-nav="dashboard"]');
     if (el) el.classList.add('active');
  } else if (state.section === 'orders') {
     const el = $('#sidebar [data-nav="orders"]');
     if (el) el.classList.add('active');
  } else if (state.section === 'kitchen') {
     const el = $('#sidebar [data-nav="kitchen"]');
     if (el) el.classList.add('active');
  }
}

function renderDashboard(main){
  const totalStockValue = DB.goods.reduce((sum, g) => sum + (currentStock(g.id) * avgPrice(g)), 0);
  const totalDishes = DB.dishes.length;
  const validDishes = DB.dishes.filter(d => dishFC(d) != null);
  const avgFc = validDishes.length ? (validDishes.reduce((sum, d) => sum + dishFC(d), 0) / validDishes.length).toFixed(1) : '—';
  
  const dishesByFc = DB.dishes.filter(d => dishFC(d) != null).sort((a,b) => dishFC(b) - dishFC(a)).slice(0, 5);
  const dishesByMargin = DB.dishes.filter(d => dishMarkup(d) != null).sort((a,b) => dishMarkup(b) - dishMarkup(a)).slice(0, 5);

  const catStock = {};
  DB.categories.forEach(c => { catStock[c.id] = 0; });
  DB.goods.forEach(g => {
    const val = currentStock(g.id) * avgPrice(g);
    if(catStock[g.category] !== undefined) catStock[g.category] += val;
  });
  const topCats = Object.entries(catStock).filter(([_, v]) => v > 0).sort((a,b) => b[1] - a[1]).slice(0, 5);
  const maxCatVal = topCats.length ? topCats[0][1] : 1;

  main.innerHTML = `
    <div class="table-scroll" style="padding:20px; background:var(--bg-app);">
      <div style="max-width:1200px; margin:0 auto;">
        
        <h2 style="font-size:20px; margin-bottom:20px; color:var(--active-text);">📊 Сводка</h2>
        
        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:20px; margin-bottom:30px;">
          <div class="mv-stat" style="padding:20px; background:var(--bg-panel); border-color:var(--active-border);">
            <div class="lbl">Стоимость остатков</div>
            <div class="val" style="font-size:28px; color:var(--active-text);">${fmt2(totalStockValue)} ₽</div>
          </div>
          <div class="mv-stat" style="padding:20px; border-color:#3b82f6; background:var(--bg-panel);">
            <div class="lbl">Блюд в меню</div>
            <div class="val" style="font-size:28px; color:#60a5fa;">${totalDishes}</div>
          </div>
          <div class="mv-stat" style="padding:20px; border-color:var(--accent-orange); background:var(--bg-panel);">
            <div class="lbl">Средний Food Cost</div>
            <div class="val" style="font-size:28px; color:var(--accent-orange);">${avgFc}%</div>
          </div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
          
          <div style="background:var(--bg-panel); border:1px solid var(--border); border-radius:6px; padding:15px;">
            <h3 style="font-size:14px; margin-bottom:15px; border-bottom:1px solid var(--border-light); padding-bottom:8px; color:var(--text-main);">🔥 Топ-5 по Food Cost (Дорогие)</h3>
            <table style="width:100%; font-size:12px;">
              <tbody>
                ${dishesByFc.map(d => `
                  <tr style="border-bottom:1px solid var(--border-light);">
                    <td style="padding:8px 0; color:var(--text-main);">${esc(d.name)}</td>
                    <td style="text-align:right; font-weight:bold; color:var(--accent-red);">${dishFC(d)}%</td>
                  </tr>
                `).join('') || '<tr><td colspan="2" style="color:var(--text-muted);">Нет данных</td></tr>'}
              </tbody>
            </table>
          </div>

          <div style="background:var(--bg-panel); border:1px solid var(--border); border-radius:6px; padding:15px;">
            <h3 style="font-size:14px; margin-bottom:15px; border-bottom:1px solid var(--border-light); padding-bottom:8px; color:var(--text-main);">💰 Топ-5 по Наценке (Прибыльные)</h3>
            <table style="width:100%; font-size:12px;">
              <tbody>
                ${dishesByMargin.map(d => `
                  <tr style="border-bottom:1px solid var(--border-light);">
                    <td style="padding:8px 0; color:var(--text-main);">${esc(d.name)}</td>
                    <td style="text-align:right; font-weight:bold; color:var(--accent-green);">+${dishMarkup(d)}%</td>
                  </tr>
                `).join('') || '<tr><td colspan="2" style="color:var(--text-muted);">Нет данных</td></tr>'}
              </tbody>
            </table>
          </div>

          <div style="background:var(--bg-panel); border:1px solid var(--border); border-radius:6px; padding:15px; grid-column: 1 / -1; margin-bottom:20px;">
            <h3 style="font-size:14px; margin-bottom:15px; border-bottom:1px solid var(--border-light); padding-bottom:8px; color:var(--text-main);">📦 Топ-5 категорий по стоимости остатков</h3>
            ${topCats.map(([catId, val]) => {
              const cat = getGoodCat(catId);
              const pct = Math.round((val / maxCatVal) * 100);
              return `
                <div style="margin-bottom:12px;">
                  <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px; color:var(--text-main);">
                    <span>${cat.icon} ${esc(cat.title)}</span>
                    <span style="font-weight:bold;">${fmt2(val)} ₽</span>
                  </div>
                  <div style="height:8px; background:var(--bg-app); border-radius:4px; overflow:hidden; border:1px solid var(--border-light);">
                    <div style="height:100%; width:${pct}%; background:var(--active-border); border-radius:4px;"></div>
                  </div>
                </div>
              `;
            }).join('') || '<div class="empty-state">Нет остатков</div>'}
          </div>

        </div>
      </div>
    </div>
  `;

  $('#statusCount').textContent = `Дашборд`;
  $('#statusSelection').textContent = '';
}

/* ===== 20-menu.js ===== */
/* ============================================================
   A_Chef · 20-menu.js
   (c) 2026 Дмитрий Князев. Все права защищены.
   Диспетчер рендера (Main) и список блюд (Меню).
   ============================================================ */

function renderMain(){
  const main = $('#mainArea');
  if(!main) return;

  if(state.section === 'dashboard'){
    renderDashboard(main);
  } else if(state.section === 'menu'){
    if(state.selectedDishId) renderDishDetail(main);
    else renderMenuList(main);
  } else if(state.section === 'goods'){
    if(state.selectedGoodId) renderGoodDetail(main);
    else renderGoodsList(main);
  } else if(state.section === 'orders'){
    renderOrdersList(main);
  } else if(state.section === 'kitchen'){
    renderKitchen(main);
  } else if(state.section === 'movement') {
    renderMovement(main);
  } else if(state.section === 'variance') {
    renderVariance(main);
  } else if(state.section === 'suppliers'){
    if(state.selectedSupplier) renderSupplierDetail(main);
    else renderSuppliersList(main);
  } else if(state.section === 'cost') {
    renderCost(main);
  }

  $('#statusSection').textContent = {
    dashboard: 'Сводка', menu: 'Меню', goods: 'Товары', orders: 'Заказы', kitchen: 'Кухня', movement: 'Движение', variance: 'Утечки', suppliers: 'Поставщики', cost: 'Себестоимость'
  }[state.section] || '';
}

function render() {
  renderSidebar();
  renderMain();
}

function renderMenuList(main){
  const q = (state.searchQuery || '').trim().toLowerCase();

  let list = (DB.dishes || []).slice();
  if(state.activeMenuCat) list = list.filter(d => d.categoryId === state.activeMenuCat);

  if(state.menuFilter === 'problems'){
    list = list.filter(d => {
      const fc = dishFC(d);
      return fc == null || fc > 40;
    });
  } else if(state.menuFilter === 'no-price'){
    list = list.filter(d => !d.price || d.price <= 0 || dishCost(d) <= 0);
  }

  if(q) list = list.filter(d => {
    const cat = getMenuCat(d.categoryId).title.toLowerCase();
    return d.name.toLowerCase().includes(q) || cat.includes(q);
  });

  list.sort((a, b) => {
    let r = 0;
    if(state.sortField === 'name') r = a.name.localeCompare(b.name, 'ru');
    else if(state.sortField === 'price') r = (a.price || 0) - (b.price || 0);
    else if(state.sortField === 'cost') r = dishCost(a) - dishCost(b);
    else if(state.sortField === 'fc'){ const fa = dishFC(a) || 0, fb = dishFC(b) || 0; r = fa - fb; }
    else r = a.name.localeCompare(b.name, 'ru');
    return state.sortAsc ? r : -r;
  });

  const catName = state.activeMenuCat ? getMenuCat(state.activeMenuCat) : null;
  const title = catName ? `${catName.icon} ${catName.title}` : '🍽 Меню ресторана';
  const sub = catName
    ? `${list.length} ${plural(list.length, 'блюдо', 'блюда', 'блюд')}`
    : `Меню · ${list.length} ${plural(list.length, 'блюдо', 'блюда', 'блюд')}`;

  const rows = list.map((d, i) => {
    const cost = dishCost(d);
    const fc = dishFC(d);
    const markup = dishMarkup(d);
    const cat = getMenuCat(d.categoryId);
    const badRows = (d.ingredients || []).filter(ing => {
      const g = getGood(ing.goodId);
      return !g || avgPrice(g) <= 0;
    }).length;
    const warnBadge = badRows > 0 ? `<span class="noprice-badge">${badRows} без цены</span>` : '';

    return `<tr data-did="${esc(d.id)}">
      <td class="col-center">${i+1}</td>
      <td>${esc(d.name)}${warnBadge}</td>
      <td>${cat.icon} ${esc(cat.title)}</td>
      <td class="col-right">${d.output || 0} г</td>
      <td class="col-right">${d.price ? d.price.toFixed(0) + ' ₽' : '—'}</td>
      <td class="col-right" style="color:#b8860b;">${cost > 0 ? fmt2(cost) + ' ₽' : '—'}</td>
      <td class="col-center"><span class="fc-badge ${fcClass(fc)}">${fc != null ? fc + '%' : '—'}</span></td>
      <td class="col-right">${markup != null ? markup + '%' : '—'}</td>
      <td class="col-center">
        <button class="row-btn" data-de="${esc(d.id)}" title="Редактировать">✎</button>
        <button class="row-btn red" data-dd="${esc(d.id)}" title="Удалить">×</button>
      </td>
    </tr>`;
  }).join('');

  main.innerHTML = `
    <div class="table-top-bar">
      <div>
        <div class="table-title">${title}</div>
        <div class="table-sub">${sub} · клик по строке открывает карточку блюда</div>
      </div>
      <input type="text" class="search-input" id="searchInput" placeholder="Поиск по блюдам…" value="${esc(state.searchQuery)}">
    </div>
    <div class="filter-tabs">
      <button class="filter-tab${state.menuFilter === 'all' ? ' active' : ''}" data-mf="all">Все</button>
      <button class="filter-tab${state.menuFilter === 'problems' ? ' active' : ''}" data-mf="problems">Проблемные (FC &gt; 40% или нет цены)</button>
      <button class="filter-tab${state.menuFilter === 'no-price' ? ' active' : ''}" data-mf="no-price">Без себестоимости</button>
    </div>
    <div class="table-scroll">
      <table class="data-grid" id="menuGrid">
        <thead>
          <tr>
            <th class="col-center no-sort" style="width:40px;">#</th>
            <th data-sort="name">Блюдо</th>
            <th class="no-sort" style="width:160px;">Категория</th>
            <th class="col-right no-sort" style="width:80px;">Выход</th>
            <th class="col-right" data-sort="price" style="width:100px;">Цена</th>
            <th class="col-right" data-sort="cost" style="width:110px;">Себестоимость</th>
            <th class="col-center" data-sort="fc" style="width:80px;">FC</th>
            <th class="col-right no-sort" style="width:90px;">Наценка</th>
            <th class="col-center no-sort" style="width:120px;">Действия</th>
          </tr>
        </thead>
        <tbody>${rows || `<tr><td colspan="9" class="empty-state">Блюд нет — добавьте первое</td></tr>`}</tbody>
      </table>
    </div>
    <div class="hint">
      💡 <b>FC (food cost)</b> = себестоимость / цена × 100%. Норма — 25–35%. Выше 40% — блюдо работает в минус или на грани.
    </div>
  `;

  const si = $('#searchInput');
  if(si) si.addEventListener('input', debounce((e) => {
    const el = e.target;
    const pos = el.selectionStart;
    state.searchQuery = el.value;
    renderMenuList(main);
    const newEl = $('#searchInput');
    if (newEl) { newEl.focus(); newEl.setSelectionRange(pos, pos); }
  }, 150));

  $$('.filter-tab').forEach(t => t.addEventListener('click', () => {
    state.menuFilter = t.dataset.mf;
    renderMenuList(main);
  }));

  $$('#menuGrid th[data-sort]').forEach(th => th.addEventListener('click', () => {
    const f = th.dataset.sort;
    if(state.sortField === f) state.sortAsc = !state.sortAsc;
    else { state.sortField = f; state.sortAsc = true; }
    renderMenuList(main);
  }));

  $$('#menuGrid tbody tr[data-did]').forEach(tr => tr.addEventListener('click', e => {
    if(e.target.closest('button')) return;
    state.selectedDishId = tr.dataset.did;
    state.dishTab = 'ttk';
    render();
  }));

  $('#statusCount').textContent = `Блюд: ${list.length}`;
}

/* ===== 30-goods.js ===== */
/* ============================================================
   A_Chef · 30-goods.js

function renderGoodsList(main){
  const q = (state.searchQuery || '').trim().toLowerCase();
  let list = DB.goods.slice();
  if(state.activeGoodsCat) list = list.filter(g => g.category === state.activeGoodsCat);
  if(state.goodsFilter === 'pf') list = list.filter(g => g.isPF);
  else if(state.goodsFilter === 'no-price') list = list.filter(g => avgPrice(g) <= 0);
  else if(state.goodsFilter === 'spread') list = list.filter(g => spreadOf(g) > 15);
  else if(state.goodsFilter === 'with-stock') list = list.filter(g => currentStock(g.id) > 0);

  if(q) list = list.filter(g => {
    const cat = getGoodCat(g.category).title.toLowerCase();
    return g.name.toLowerCase().includes(q) || cat.includes(q);
  });

  list.sort((a, b) => {
    let r = 0;
    if(state.sortField === 'name') r = a.name.localeCompare(b.name, 'ru');
    else if(state.sortField === 'price') r = avgPrice(a) - avgPrice(b);
    else if(state.sortField === 'count') r = countPrices(a) - countPrices(b);
    else if(state.sortField === 'stock') r = currentStock(a.id) - currentStock(b.id);
    else r = a.name.localeCompare(b.name, 'ru');
    return state.sortAsc ? r : -r;
  });

  const catName = state.activeGoodsCat ? getGoodCat(state.activeGoodsCat) : null;
  const title = catName ? `${catName.icon} ${catName.title}` : '📦 Все товары';
  const sub = catName
    ? `Категория · ${DB.goods.filter(g => g.category === state.activeGoodsCat).length} позиций`
    : `Справочник от А до Я · ${DB.goods.length} ${plural(DB.goods.length, 'позиция', 'позиции', 'позиций')}`;

  const filters = `
    <div class="filter-tabs">
      <button class="filter-tab${state.goodsFilter === 'all' ? ' active' : ''}" data-gf="all">Все</button>
      <button class="filter-tab${state.goodsFilter === 'pf' ? ' active' : ''}" data-gf="pf">П/Ф</button>
      <button class="filter-tab${state.goodsFilter === 'with-stock' ? ' active' : ''}" data-gf="with-stock">Есть остаток</button>
      <button class="filter-tab${state.goodsFilter === 'no-price' ? ' active' : ''}" data-gf="no-price">Без цены</button>
      <button class="filter-tab${state.goodsFilter === 'spread' ? ' active' : ''}" data-gf="spread">Разброс &gt;15%</button>
    </div>
  `;

  const rows = list.map((g, i) => {
    const p = avgPrice(g);
    const cnt = countPrices(g);
    const sp = spreadOf(g);
    const stock = currentStock(g.id);
    const stockCls = stock > 0 ? '' : (stock < 0 ? 'negative' : 'zero');
    const cat = getGoodCat(g.category);
    const pfBadge = g.isPF ? '<span class="pf-badge">П/Ф</span>' : '';
    const npBadge = p <= 0 ? '<span class="noprice-badge">Нет цены</span>' : '';
    const spCls = sp > 30 ? 'fc-bad' : sp > 15 ? 'fc-warn' : 'fc-good';

    return `<tr data-gid="${esc(g.id)}">
      <td class="col-center">${i+1}</td>
      <td>${esc(g.name)}${pfBadge}${npBadge}</td>
      <td>${cat.icon} ${esc(cat.title)}</td>
      <td class="col-center">${esc(g.unit)}</td>
      <td class="col-right">${p > 0 ? fmt2(p) + ' ₽' : '—'}</td>
      <td class="col-right ${stockCls ? 'stock-cell ' + stockCls : 'stock-cell'}">${fmt3(stock)}</td>
      <td class="col-center">${cnt}</td>
      <td class="col-center">${sp > 0 ? `<span class="fc-badge ${spCls}">+${sp.toFixed(1)}%</span>` : '—'}</td>
      <td class="col-center">
        <button class="row-btn orange" data-move="${esc(g.id)}" title="Добавить движение">🚚</button>
        <button class="row-btn" data-edit="${esc(g.id)}" title="Редактировать">✎</button>
        <button class="row-btn red" data-del="${esc(g.id)}" title="Удалить">×</button>
      </td>
    </tr>`;
  }).join('');

  main.innerHTML = `
    <div class="table-top-bar">
      <div>
        <div class="table-title">${title}</div>
        <div class="table-sub">${sub}</div>
      </div>
      <input type="text" class="search-input" id="searchInput" placeholder="Поиск по товарам…" value="${esc(state.searchQuery)}">
    </div>
    ${filters}
    <div class="table-scroll">
      <table class="data-grid" id="goodsGrid">
        <thead>
          <tr>
            <th class="col-center no-sort" style="width:40px;">#</th>
            <th data-sort="name">Наименование</th>
            <th class="no-sort" style="width:180px;">Категория</th>
            <th class="col-center no-sort" style="width:50px;">Ед.</th>
            <th class="col-right" data-sort="price" style="width:110px;">Средняя цена</th>
            <th class="col-right" data-sort="stock" style="width:90px;">Остаток</th>
            <th class="col-center" data-sort="count" style="width:100px;">Поставщиков</th>
            <th class="col-center no-sort" style="width:90px;">Разброс</th>
            <th class="col-center no-sort" style="width:120px;">Действия</th>
          </tr>
        </thead>
        <tbody>${rows || `<tr><td colspan="9" class="empty-state">Ничего не найдено</td></tr>`}</tbody>
      </table>
    </div>
  `;

  const si = $('#searchInput');
  if(si) si.addEventListener('input', debounce((e) => {
    const el = e.target;
    const pos = el.selectionStart;
    state.searchQuery = el.value;
    renderGoodsList(main);
    const newEl = $('#searchInput');
    if (newEl) { newEl.focus(); newEl.setSelectionRange(pos, pos); }
  }, 150));

  $$('.filter-tab').forEach(t => t.addEventListener('click', () => {
    state.goodsFilter = t.dataset.gf;
    renderGoodsList(main);
  }));

  $$('#goodsGrid th[data-sort]').forEach(th => th.addEventListener('click', () => {
    const f = th.dataset.sort;
    if(state.sortField === f) state.sortAsc = !state.sortAsc;
    else { state.sortField = f; state.sortAsc = true; }
    renderGoodsList(main);
  }));

  $$('#goodsGrid tbody tr[data-gid]').forEach(tr => tr.addEventListener('click', e => {
    if(e.target.closest('button')) return;
    state.selectedGoodId = tr.dataset.gid;
    state.goodTab = 'prices';
    render();
  }));

  $('#statusCount').textContent = `Записей: ${list.length}`;
}

function goodPricesTab(g){
  const validPrices = (g.prices || []).filter(p => p.supplier !== SUPPLIER_MANUAL);
  const supplierList = Array.from(new Set([...(DB.suppliers || []), ...validPrices.map(p => p.supplier)]));

  const rowsHtml = validPrices.map((p, i) => {
    const isSelf = p.supplier === SUPPLIER_SELF;
    const all = validPrices.map(x => x.price).filter(x => x > 0);
    const mn = all.length ? Math.min(...all) : 0;
    const mx = all.length ? Math.max(...all) : 0;
    const isBest = p.price === mn && all.length > 1 && !isSelf;
    const isWorst = p.price === mx && mn !== mx && !isSelf;
    const cls = isBest ? 'good-best' : (isWorst ? 'good-worst' : 'good-mid');
    return `<tr>
      <td>${esc(p.supplier)}</td>
      <td class="col-right ${cls}">${isSelf ? `<b>${fmt2(p.price)}</b>` : `<input type="number" step="0.01" class="inline-price" data-price-edit="${i}" value="${p.price.toFixed(2)}">`}</td>
      <td class="col-center" style="color:var(--text-muted);font-size:11px;">${esc(p.date || '')}</td>
      <td class="col-center">${isSelf ? '' : `<button class="row-btn red" data-price-del="${i}">×</button>`}</td>
    </tr>`;
  }).join('');

  return `
    <div style="padding:14px 16px;">
      <table class="price-grid" style="margin-bottom:14px;">
        <thead><tr><th>Поставщик</th><th class="col-right" style="width:120px;">Цена, ₽</th><th class="col-center" style="width:100px;">Дата</th><th class="col-center" style="width:50px;"></th></tr></thead>
        <tbody>${rowsHtml || `<tr><td colspan="4" class="empty-state">Цен пока нет</td></tr>`}</tbody>
      </table>
      <div style="padding-top:12px;border-top:1px solid var(--border);">
        <div style="font-weight:bold;margin-bottom:8px;font-size:12px;">Добавить цену</div>
        <div style="display:grid;grid-template-columns:1fr 130px 110px;gap:8px;">
          <input id="np-supplier" type="text" list="np-sup-list" placeholder="Поставщик" style="padding:6px 10px;border:1px solid var(--border);border-radius:3px;font-family:inherit;font-size:12px;">
          <input id="np-price" type="number" step="0.01" placeholder="Цена" style="padding:6px 10px;border:1px solid var(--border);border-radius:3px;font-family:inherit;font-size:12px;text-align:right;">
          <button type="button" class="btn primary" id="np-add">＋ Добавить</button>
        </div>
        <datalist id="np-sup-list">${supplierList.map(s => `<option value="${esc(s)}"></option>`).join('')}</datalist>
      </div>
    </div>
  `;
}

function bindGoodPrices(g, main){
  const validPrices = (g.prices || []).filter(p => p.supplier !== SUPPLIER_MANUAL);
  $$('[data-price-edit]').forEach(inp => {
    const idx = parseInt(inp.dataset.priceEdit, 10);
    const commit = () => {
      const val = parseFloat(inp.value);
      if(isNaN(val) || val < 0){ toast('Некорректная цена', 'error'); return; }
      const vp = validPrices[idx]; if(!vp) return;
      if(vp.supplier === SUPPLIER_SELF) return;
      const real = g.prices.find(p => p.supplier === vp.supplier); if(!real) return;
      real.price = val;
      real.date = todayISO();
      recalcPF(); saveDB();
      toast('Цена обновлена', 'success');
      renderGoodDetail(main);
    };
    inp.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); inp.blur(); } });
    inp.addEventListener('blur', commit);
  });
  $$('[data-price-del]').forEach(b => b.addEventListener('click', () => {
    const idx = parseInt(b.dataset.priceDel, 10);
    const vp = validPrices[idx]; if(!vp) return;
    if(vp.supplier === SUPPLIER_SELF) return;
    if(!confirm(`Удалить цену «${vp.supplier}»?`)) return;
    g.prices = g.prices.filter(p => p.supplier !== vp.supplier);
    recalcPF(); saveDB();
    renderGoodDetail(main);
  }));
  $('#np-add').addEventListener('click', () => {
    const sup = ($('#np-supplier').value || '').trim();
    const price = parseFloat($('#np-price').value);
    if(!sup){ toast('Введите поставщика', 'error'); return; }
    if(isNaN(price) || price <= 0){ toast('Введите цену', 'error'); return; }
    const existing = g.prices.find(p => p.supplier === sup);
    if(existing){ existing.price = price; existing.date = todayISO(); }
    else g.prices.push({ supplier: sup, price, date: todayISO() });
    if(!DB.suppliers.includes(sup)) DB.suppliers.push(sup);
    recalcPF(); saveDB();
    toast('Цена добавлена', 'success');
    renderGoodDetail(main);
  });
}

    </div>
    <div style="padding:12px 16px;">
      <button class="btn primary" id="goodAddMovement" style="margin-bottom:12px;">＋ Добавить движение</button>

        <thead><tr><th class="col-center" style="width:110px;">Дата</th><th class="col-center" style="width:130px;">Тип</th><th class="col-right" style="width:110px;">Кол-во</th><th class="col-right" style="width:110px;">Сумма</th><th style="width:180px;">Поставщик / причина</th><th>Примечание</th><th class="col-center" style="width:80px;"></th></tr></thead>
        <tbody>${rowsHtml || `<tr><td colspan="7" class="empty-state">Движений пока нет</td></tr>`}</tbody>
      </table>
    </div>
  `;
}

function bindDishTTK(d, main){
  function recalcIngredient(ing, fromField){
    const good = getGood(ing.goodId);
    if(!good) return;
    const waste = ing.waste != null ? ing.waste : goodWaste(good);
    const cookLoss = ing.cookLoss != null ? ing.cookLoss : goodCookLoss(good);
    
    if(fromField === 'brutto'){
      ing.netto = calcNettoFromBrutto(ing.brutto, waste);
      ing.final = calcFinalFromNetto(ing.netto, cookLoss);
    } else if(fromField === 'netto'){
      ing.brutto = calcBruttoFromNetto(ing.netto, waste);
      ing.final = calcFinalFromNetto(ing.netto, cookLoss);
    } else if(fromField === 'final'){
      ing.netto = calcNettoFromFinal(ing.final, cookLoss);
      ing.brutto = calcBruttoFromNetto(ing.netto, waste);
    }
  }

  // Обработка изменения текста в поле "Товар" (чтобы обновить ID)
  $$('[data-f="goodId"]').forEach(inp => {
    inp.addEventListener('change', () => {
      const i = parseInt(inp.dataset.ingIdx, 10);
      if(!d.ingredients[i]) return;
      
      const val = inp.value.trim();
      const datalist = document.getElementById('editDishGoodsList');
      const matchedOpt = Array.from(datalist.options).find(o => o.value === val);
      
      if (matchedOpt) {
        d.ingredients[i].goodId = matchedOpt.dataset.id;
        const from = (d.ingredients[i].netto > 0) ? 'netto' : (d.ingredients[i].brutto > 0 ? 'brutto' : 'netto');
        recalcIngredient(d.ingredients[i], from);
        saveDB();
        renderDishDetail(main);
      } else if (!val) {
        d.ingredients[i].goodId = null;
        saveDB();
        renderDishDetail(main);
      }
    });
  });

  $$('[data-f="brutto"], [data-f="netto"], [data-f="final"]').forEach(inp => {
    inp.addEventListener('change', () => {
      const i = parseInt(inp.dataset.ingIdx, 10);
      const f = inp.dataset.f;
      if(!d.ingredients[i]) return;
      const v = Math.max(0, parseFloat(inp.value) || 0);
      d.ingredients[i][f] = v;
      recalcIngredient(d.ingredients[i], f);
      saveDB();
      renderDishDetail(main);
    });
  });

  $$('[data-f="waste"], [data-f="cookLoss"]').forEach(inp => {
    inp.addEventListener('change', () => {
      const i = parseInt(inp.dataset.ingIdx, 10);
      const f = inp.dataset.f;
      if(!d.ingredients[i]) return;
      let v = parseFloat(inp.value);
      if(isNaN(v) || v < 0) v = 0;
      if(v > 99.99) v = 99.99;
      d.ingredients[i][f] = v;
      const ing = d.ingredients[i];
      const good = getGood(ing.goodId);
      if(!good) return;
      const w = ing.waste != null ? ing.waste : goodWaste(good);
      const c = ing.cookLoss != null ? ing.cookLoss : goodCookLoss(good);
      ing.netto = calcNettoFromBrutto(ing.brutto, w);
      ing.final = calcFinalFromNetto(ing.netto, c);
      
      saveDB();
      renderDishDetail(main);
    });
  });

  $$('[data-recalc]').forEach(b => b.addEventListener('click', () => {
    const i = parseInt(b.dataset.recalc, 10);
    if(!d.ingredients[i]) return;
    const good = getGood(d.ingredients[i].goodId);
    if(!good){ toast('Сначала выберите товар', 'error'); return; }
    const ing = d.ingredients[i];
    const netto = ing.netto || 0;
    if(netto <= 0){ toast('Сначала задайте нетто', 'error'); return; }
    const w = ing.waste != null ? ing.waste : goodWaste(good);
    const c = ing.cookLoss != null ? ing.cookLoss : goodCookLoss(good);
    ing.brutto = calcBruttoFromNetto(netto, w);
    ing.final = calcFinalFromNetto(netto, c);
    saveDB();
    renderDishDetail(main);
  }));

  $$('[data-del-ing]').forEach(b => b.addEventListener('click', () => {
    const i = parseInt(b.dataset.delIng, 10);
    d.ingredients.splice(i, 1);
    saveDB();
    renderDishDetail(main);
  }));

  const addBtn = $('#newIngAdd');
  if(addBtn) addBtn.addEventListener('click', () => {
    const inputVal = $('#newIngGood').value.trim();
    const datalist = document.getElementById('editDishGoodsList');
    const matchedOpt = Array.from(datalist.options).find(o => o.value === inputVal);
    
    if (!matchedOpt) { 
      toast('Выберите товар из выпадающего списка', 'error'); 
      return; 
    }
    
    const goodId = matchedOpt.dataset.id;
    const g = getGood(goodId);
    const netto = parseFloat($('#newIngNetto').value) || 0;
    if(netto <= 0){ toast('Нетто должно быть > 0', 'error'); return; }
    const waste = goodWaste(g);
    const cookLoss = goodCookLoss(g);
    const brutto = calcBruttoFromNetto(netto, waste);
    const final = calcFinalFromNetto(netto, cookLoss);

    d.ingredients.push({ id: uid('ing'), goodId, brutto, netto, final });
    saveDB();
    toast('Ингредиент добавлен', 'success');
    renderDishDetail(main);
  });

  const fitBtn = $('#fitToOutputBtn');
  if(fitBtn) fitBtn.addEventListener('click', () => {
    if (scaleDishToOutput(d)) {
      saveDB();
      renderDishDetail(main);
      toast('Ингредиенты подогнаны под выход ' + d.output + ' г', 'success');
    } else {
      toast('Уже совпадает с выходом', 'success');
    }
  });
}

function renderMovement(main){
  const q = (state.searchQuery || '').trim().toLowerCase();
  let movements = (DB.movements || []).slice();
  if(state.movementFilter !== 'all') movements = movements.filter(m => m.type === state.movementFilter);
  if(state.movementGoodId) movements = movements.filter(m => m.goodId === state.movementGoodId);
  if(q) movements = movements.filter(m => {
    const g = getGood(m.goodId);
    return (g && g.name.toLowerCase().includes(q)) || (m.note && m.note.toLowerCase().includes(q)) || (m.reason && m.reason.toLowerCase().includes(q));
  });
  movements.sort((a, b) => (b.date + b.createdAt).localeCompare(a.date + a.createdAt));

  const stockRows = DB.goods.map(g => ({ g, st: movementStats(g.id) }))
    .filter(x => x.st.stock !== 0 || x.st.inQty > 0 || x.st.outQty > 0)
    .sort((a, b) => a.g.name.localeCompare(b.g.name, 'ru'));

  const totalStockValue = stockRows.reduce((s, x) => s + x.st.stockValue, 0);
  const totalIn = stockRows.reduce((s, x) => s + x.st.inSum, 0);
  const totalOut = stockRows.reduce((s, x) => s + x.st.outSum, 0);

  const stockTableHtml = stockRows.length ? stockRows.map((x, i) => {
    const stockCls = x.st.stock > 0 ? '' : (x.st.stock < 0 ? 'negative' : 'zero');
    return `<tr data-gid="${esc(x.g.id)}">
      <td class="col-center">${i+1}</td>
      <td>${esc(x.g.name)}${x.g.isPF ? '<span class="pf-badge">П/Ф</span>' : ''}</td>

        <button class="row-btn" data-mv-edit="${esc(m.id)}">✎</button>

   Модуль Утечки (Разница между системным и фактическим остатком).
   ============================================================ */

function renderVariance(main){
  const q = (state.searchQuery || '').trim().toLowerCase();
  
  // Берем только корректировки, где был минус (недостача)
  let leaks = (DB.movements || []).filter(m => m.type === 'adjust' && m.delta < 0);
  
  if(q) leaks = leaks.filter(m => {
    const g = getGood(m.goodId);
    return (g && g.name.toLowerCase().includes(q)) || (m.note && m.note.toLowerCase().includes(q));
  });
  
  leaks.sort((a, b) => (b.date + b.createdAt).localeCompare(a.date + a.createdAt));

  let totalLossQty = 0;
  let totalLossSum = 0;

  const rows = leaks.map((m, i) => {
    const good = getGood(m.goodId);
    if(!good) return '';
    
    const qtyLost = Math.abs(m.delta);
    // Себестоимость потерь берем из текущей средней цены (или из партии)
    const price = avgPrice(good); 
    const sumLost = qtyLost * price;
    
    totalLossQty += qtyLost;
    totalLossSum += sumLost;

    return `<tr>
      <td class="col-center">${esc(m.date)}</td>
      <td>${esc(good.name)}</td>
      <td class="col-center">${esc(good.unit)}</td>
      <td class="col-right" style="color:var(--text-muted);">${fmt3(m.qty - m.delta)}</td>
      <td class="col-right" style="font-weight:bold;">${fmt3(m.qty)}</td>
      <td class="col-right" style="color:var(--accent-red); font-weight:bold;">-${fmt3(qtyLost)}</td>
      <td class="col-right">${fmt2(price)} ₽</td>
      <td class="col-right" style="color:var(--accent-red); font-weight:bold;">${fmt2(sumLost)} ₽</td>
      <td style="font-size:11px; color:var(--text-muted);">${esc(m.note || m.reason || 'Инвентаризация')}</td>
    </tr>`;
  }).join('');

  main.innerHTML = `
    <div class="table-top-bar">
      <div>
        <div class="table-title">📉 Утечки (Недостачи)</div>
        <div class="table-sub">Анализ расхождений при инвентаризации</div>
      </div>
      <input type="text" class="search-input" id="searchInput" placeholder="Поиск по товару или причине…" value="${esc(state.searchQuery)}">
    </div>
    
    <div class="movement-summary">
      <div class="mv-stat out" style="grid-column: span 2; display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div class="lbl" style="color:var(--accent-red);">Общая сумма недостач</div>
          <div class="val" style="font-size:32px; color:var(--accent-red);">${fmt2(totalLossSum)} ₽</div>
        </div>
        <div style="font-size:14px; color:var(--text-muted); text-align:right;">
          Всего утеряно:<br><b>${fmt3(totalLossQty)}</b> ед. товара
        </div>
      </div>
    </div>

    <div class="table-scroll">
      <table class="data-grid" id="varianceGrid">
        <thead>
          <tr>
            <th class="col-center no-sort" style="width:100px;">Дата</th>
            <th class="no-sort">Товар</th>
            <th class="col-center no-sort" style="width:50px;">Ед.</th>
            <th class="col-right no-sort" style="width:100px;">Было (система)</th>
            <th class="col-right no-sort" style="width:100px;">Стало (факт)</th>
            <th class="col-right no-sort" style="width:100px; color:var(--accent-red);">Недостача</th>
            <th class="col-right no-sort" style="width:100px;">Цена за ед.</th>
            <th class="col-right no-sort" style="width:120px; color:var(--accent-red);">Сумма ущерба</th>
            <th class="no-sort">Причина / Примечание</th>
          </tr>
        </thead>
        <tbody>${rows || `<tr><td colspan="9" class="empty-state" style="padding:60px;">Утечек не обнаружено. Отличная работа!</td></tr>`}</tbody>
      </table>
    </div>
    <div class="hint danger" style="margin-top:20px;">
      💡 <b>Как это работает:</b> Когда вы делаете «Корректировку» (инвентаризацию) и фактический остаток меньше системного, программа фиксирует это как <b>Недостачу</b>. Сумма ущерба считается по средней себестоимости товара.
    </div>
  `;

  const si = $('#searchInput');
  if(si) si.addEventListener('input', debounce((e) => {
    const el = e.target;
    const pos = el.selectionStart;
    state.searchQuery = el.value;
    renderVariance(main);
    const newEl = $('#searchInput');
    if (newEl) { newEl.focus(); newEl.setSelectionRange(pos, pos); }
  }, 150));

  $('#statusCount').textContent = `Утечек: ${leaks.length}`;
  $('#statusSelection').textContent = '';
}

function renderSuppliersList(main){
  const suppliers = collectSuppliers();
  const cards = suppliers.map(s => {
    let best = 0, worst = 0;
    s.goods.forEach(({ good, price }) => {
      const valid = (good.prices || []).filter(p => p.supplier !== SUPPLIER_SELF && p.supplier !== SUPPLIER_MANUAL && p.price > 0);
      if(valid.length < 2) return;
      const others = valid.filter(p => p.supplier !== s.name);
      if(!others.length) return;
      const mn = Math.min(...others.map(p => p.price));
      const mx = Math.max(...others.map(p => p.price));
      if(price < mn) best++;
      if(price > mx) worst++;
    });
    return `<div class="sup-card" data-sup="${esc(s.name)}">
      <div>
        <div class="sup-card-name">🏭 ${esc(s.name)}</div>
        <div class="sup-card-meta">Позиций: <b>${s.goods.length}</b> · Сумма: <b>${fmt2(s.total)} ₽</b></div>
        <div style="margin-top:4px;">${best ? `<span class="sup-badge best">🥇 Лучше всех: ${best}</span>` : ''}${worst ? `<span class="sup-badge worst">⚠ Хуже всех: ${worst}</span>` : ''}</div>
      </div>
      <div style="font-size:20px;color:var(--active-text);">→</div>
    </div>`;
  }).join('');

  main.innerHTML = `
    <div class="table-top-bar">
      <div>
        <div class="table-title">🏭 Поставщики</div>
        <div class="table-sub">${suppliers.length} ${plural(suppliers.length, 'поставщик', 'поставщика', 'поставщиков')}</div>

  $('#statusCount').textContent = `Поставщиков: ${suppliers.length}`;
}

          const mn = valid.length ? Math.min(...valid.map(p => p.price)) : price;
          const mx = valid.length ? Math.max(...valid.map(p => p.price)) : price;
          const avg = valid.length ? valid.reduce((s, p) => s + p.price, 0) / valid.length : price;

          const cls = isBest ? 'good-best' : (isWorst ? 'good-worst' : 'good-mid');

          return `<tr>

// Функция сжатия фото
function compressImage(file, maxWidth, callback) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let width = img.width;
      let height = img.height;
      
      if (width > maxWidth) {
        height = Math.round((height * maxWidth) / width);
        width = maxWidth;
      }
      
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      
      callback(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function openAddMovementModal(presetGoodId){

    .map(g => ({ value: g.id, label: g.name + ' (' + g.unit + ')' }));
