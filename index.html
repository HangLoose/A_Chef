      <select id="mv-type">
        <option value="in">Приход (поставка)</option>
        <option value="out">Расход (списание)</option>
        <option value="adjust">Корректировка (инвентаризация)</option>
      </select>
    </div>
    <div class="modal-field"><label>Товар</label>
      <select id="mv-good">
        ${goodOptions.map(o => `<option value="${o.value}"${o.value === presetGoodId ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}
      </select>
    </div>
    <div class="modal-field"><label>Дата</label><input id="mv-date" type="date" value="${todayISO()}"></div>
    <div class="modal-field" id="mv-qty-wrap">
      <label>Количество</label>
      <input id="mv-qty" type="number" step="0.001" value="1" min="0">
      <div class="modal-field-hint" id="mv-qty-hint"></div>
    </div>
    <div class="modal-field" id="mv-price-wrap">
      <label>Цена за единицу, ₽</label>
      <input id="mv-price" type="number" step="0.01" value="0" min="0">
    </div>
    <div class="modal-field" id="mv-supplier-wrap">
      <label>Поставщик</label>
      <input id="mv-supplier" type="text" list="mv-sup-list" placeholder="Например: Дана">
      <datalist id="mv-sup-list">${(DB.suppliers || []).map(s => `<option value="${esc(s)}"></option>`).join('')}</datalist>
    </div>
    <div class="modal-field" id="mv-reason-wrap" style="display:none;">
      <label>Причина</label>
      <select id="mv-reason">
        <option>Списание на блюдо</option>
        <option>Порча / истёк срок</option>
        <option>Бой / поломка</option>
        <option>Естественная убыль</option>
        <option>Дегустация / тест</option>
        <option>Ошибка сотрудника</option>
        <option>Прочее</option>
      </select>
    </div>
    <div class="modal-field"><label id="mv-note-label">Примечание</label><input id="mv-note" type="text" placeholder="Опционально"></div>
  `;

  openModal({
    title: '🚚 Новое движение',
    html,
    okLabel: 'Сохранить',
    onSubmit: () => {
      const type = $('#mv-type').value;
      const goodId = $('#mv-good').value;
      const date = $('#mv-date').value || todayISO();
      const note = ($('#mv-note').value || '').trim();
      const good = getGood(goodId);
      if(!good){ toast('Товар не найден', 'error'); return; }

      if(type === 'in'){
        const qty = parseFloat($('#mv-qty').value) || 0;
        const price = parseFloat($('#mv-price').value) || 0;
        const supplier = ($('#mv-supplier').value || '').trim();
        if(qty <= 0){ toast('Количество > 0', 'error'); return; }
        if(price <= 0){ toast('Цена > 0', 'error'); return; }
        if(!supplier){ toast('Введите поставщика', 'error'); return; }
        
        const mvId = uid('mv');
        DB.movements.push({
          id: mvId, goodId, date, type: 'in',
          qty, unitPrice: price, total: qty * price,
          supplier, note, createdAt: new Date().toISOString()
        });

        // СОЗДАЕМ ПАРТИЮ
        DB.batches.push({
          id: uid('b'),
          movementId: mvId,
          goodId, date,
          qty, remainingQty: qty,
          price
        });
        
        const existingPrice = good.prices.find(p => p.supplier === supplier);
        if (existingPrice) {
            existingPrice.price = price;
            existingPrice.date = date;
        } else {
            good.prices.push({ supplier, price, date });
        }
        if(!DB.suppliers.includes(supplier)) DB.suppliers.push(supplier);
        recalcPF();
        
      } else if(type === 'out'){
        const qty = parseFloat($('#mv-qty').value) || 0;
        const reason = $('#mv-reason').value;
        if(qty <= 0){ toast('Количество > 0', 'error'); return; }
        
        // СПИСЫВАЕМ ПО FIFO
        const realCost = consumeFIFO(goodId, qty);
        
        DB.movements.push({
          id: uid('mv'), goodId, date, type: 'out',
          qty, unitPrice: qty > 0 ? (realCost/qty) : 0, total: realCost,
          reason, note, createdAt: new Date().toISOString()
        });
      } else {
        const newQty = parseFloat($('#mv-qty').value) || 0;
        if(newQty < 0){ toast('Количество ≥ 0', 'error'); return; }
        if(!note) { toast('Для инвентаризации обязательно укажите причину в примечании!', 'error'); return; }
        
        const current = currentStock(goodId);
        const delta = newQty - current;
        
        if (delta > 0) {
            DB.batches.push({ id: uid('b'), goodId, date, qty: delta, remainingQty: delta, price: avgPrice(good) });
        } else if (delta < 0) {
            consumeFIFO(goodId, Math.abs(delta));
        }

        DB.movements.push({
          id: uid('mv'), goodId, date, type: 'adjust',
          qty: newQty, delta, unitPrice: 0, total: 0,
          reason: 'Инвентаризация', note, createdAt: new Date().toISOString()
        });
      }
      saveDB(); closeModal();
      toast('Движение добавлено', 'success');
      render();
    }
  });

  setTimeout(() => {
    const typeSel = $('#mv-type');
    const goodSel = $('#mv-good');
    const qtyWrap = $('#mv-qty-wrap');
    const qtyInp = $('#mv-qty');
    const qtyHint = $('#mv-qty-hint');
    const priceWrap = $('#mv-price-wrap');
    const supplierWrap = $('#mv-supplier-wrap');
    const reasonWrap = $('#mv-reason-wrap');
    const noteLabel = $('#mv-note-label');

    function updateFields(){
      const type = typeSel.value;
      const good = getGood(goodSel.value);
      if(!good) return;
      if(type === 'in'){
        priceWrap.style.display = ''; supplierWrap.style.display = ''; reasonWrap.style.display = 'none';
        qtyHint.textContent = 'Сколько пришло (' + good.unit + ')';
        qtyInp.value = 1;
        noteLabel.innerHTML = 'Примечание';
      } else if(type === 'out'){
        priceWrap.style.display = 'none'; supplierWrap.style.display = 'none'; reasonWrap.style.display = '';
        qtyHint.textContent = 'Сколько списать (' + good.unit + '). Остаток: ' + fmt3(currentStock(good.id));
        qtyInp.value = 0.1;
        noteLabel.innerHTML = 'Примечание';
      } else {
        priceWrap.style.display = 'none'; supplierWrap.style.display = 'none'; reasonWrap.style.display = 'none';
        qtyHint.textContent = 'Фактическое количество (' + good.unit + '). Текущий остаток: ' + fmt3(currentStock(good.id));
        qtyInp.value = currentStock(good.id);
        noteLabel.innerHTML = 'Причина расхождения <span style="color:red">*</span>';
      }
    }
    typeSel.addEventListener('change', updateFields);
    goodSel.addEventListener('change', updateFields);
    updateFields();
  }, 50);
}

function openEditMovementModal(m){
  const good = getGood(m.goodId);
  if(!good) return;
  
  let fields = [];
  if(m.type === 'in'){
    fields = [
      { id: 'date', label: 'Дата', type: 'date', value: m.date },
      { id: 'qty', label: 'Количество ('+good.unit+')', type: 'number', step: '0.001', value: m.qty },
      { id: 'price', label: 'Цена за ед., ₽', type: 'number', step: '0.01', value: m.unitPrice },
      { id: 'supplier', label: 'Поставщик', type: 'text', value: m.supplier || '' },
      { id: 'note', label: 'Примечание', type: 'text', value: m.note || '' }
    ];
  } else if(m.type === 'out'){
    fields = [
      { id: 'date', label: 'Дата', type: 'date', value: m.date },
      { id: 'qty', label: 'Количество ('+good.unit+')', type: 'number', step: '0.001', value: m.qty },
      { id: 'reason', label: 'Причина', type: 'text', value: m.reason || '' },
      { id: 'note', label: 'Примечание', type: 'text', value: m.note || '' }
    ];
  } else {
    fields = [
      { id: 'date', label: 'Дата', type: 'date', value: m.date },
      { id: 'qty', label: 'Фактическое кол-во ('+good.unit+')', type: 'number', step: '0.001', value: m.qty },
      { id: 'note', label: 'Примечание', type: 'text', value: m.note || '' }
    ];
  }

  openModal({
    title: '✎ Редактировать движение',
    fields,
    okLabel: 'Сохранить',
    onSubmit: () => {
      m.date = $('#f-date').value;
      m.note = ($('#f-note').value || '').trim();
      
      if(m.type === 'in'){
        const newQty = parseFloat($('#f-qty').value) || 0;
        const newPrice = parseFloat($('#f-price').value) || 0;
        m.qty = newQty;
        m.unitPrice = newPrice;
        m.supplier = ($('#f-supplier').value || '').trim();
        m.total = m.qty * m.unitPrice;
        
        const batch = DB.batches.find(b => b.movementId === m.id);
        if (batch) {
            const diff = newQty - batch.qty;
            batch.qty = newQty;
            batch.remainingQty += diff;
            if (batch.remainingQty < 0) batch.remainingQty = 0;
            batch.price = newPrice;
            batch.date = m.date;
        }
        
        if(m.supplier && m.unitPrice > 0){
          const existing = good.prices.find(p => p.supplier === m.supplier);
          if(existing){ existing.price = m.unitPrice; existing.date = m.date; }
          else { good.prices.push({ supplier: m.supplier, price: m.unitPrice, date: m.date }); }
        }
      } else if(m.type === 'out'){
        m.qty = parseFloat($('#f-qty').value) || 0;
        m.reason = ($('#f-reason').value || '').trim();
      } else {
        m.qty = parseFloat($('#f-qty').value) || 0;
      }
      
      recalcPF(); saveDB(); closeModal();
      toast('Движение сохранено', 'success');
      render();
    }
  });
}

        <button type="button" class="btn" id="pf-edit-add" style="margin-top:8px;">＋ Добавить</button>
      `,
      okLabel: 'Сохранить',
      onSubmit: () => {
        const name = ($('#pf-edit-name').value || '').trim();
        if(!name){ toast('Введите название', 'error'); return; }

        row.style.cssText = 'display:grid;grid-template-columns:1fr 110px 34px;gap:8px;align-items:center;margin-bottom:8px;';
        row.innerHTML = `
          <input type="text" list="edit-all-goods" data-line-good value="" placeholder="🔍 Поиск..." style="padding:6px 10px;border:1px solid var(--border);border-radius:4px;font-family:inherit;font-size:12px;background:var(--bg-app);color:var(--text-main);">

      if(name !== g.name && getGoodByName(name)){ toast('Такое имя уже есть', 'error'); return; }
      const oldName = g.name;

      g.name = name;
      g.unit = $('#f-unit').value;
      g.category = $('#f-category').value;
      g.waste = Math.max(0, Math.min(99.99, parseFloat($('#f-waste').value) || 0));

      if (name !== oldName) {

                  (x.lines || []).forEach(l => { if (l.goodName === oldName) l.goodName = name; });

          });
      }
      
      if (g.unit !== oldUnit) {
          const usedByDish = DB.dishes.filter(d => d.ingredients.some(ing => ing.goodId === g.id));
          if (usedByDish.length) {
              toast(`Внимание: товар используется в ${usedByDish.length} блюдах. Проверьте веса.`, 'error');
          }
      }
      
      recalcPF(); saveDB(); closeModal();
      toast('Сохранено', 'success');
      render();
    }
  });
}

function deleteGood(g){
  const usedByPF = DB.goods.filter(x =>
    (x.isPF && x.pfType === 'processing' && x.parentName === g.name) ||
    (x.isPF && x.pfType === 'composite' && (x.lines || []).some(l => l.goodName === g.name))
  );
  if(usedByPF.length){ toast(`Используется в П/Ф: ${usedByPF.map(x => x.name).join(', ')}`, 'error'); return; }

  const usedByDish = (DB.dishes || []).filter(d => (d.ingredients || []).some(ing => ing.goodId === g.id));
  if(usedByDish.length){
    toast(`Используется в блюдах: ${usedByDish.map(d => d.name).join(', ')}`, 'error');
    return;
  }

  if(!confirm(`Удалить «${g.name}»?`)) return;
  if((DB.movements || []).some(m => m.goodId === g.id)){
    if(!confirm('У товара есть движения. Удалить и их?')) return;
    DB.movements = (DB.movements || []).filter(m => m.goodId !== g.id);
    DB.batches = (DB.batches || []).filter(b => b.goodId !== g.id);
  }
  DB.goods = DB.goods.filter(x => x.id !== g.id);
  recalcPF(); saveDB(true);
  state.selectedGoodId = null;
  state.selectedRowId = null;
  toast('Удалено', 'error');
  render();
}

      if(!name){ toast('Введите название', 'error'); return; }
      const copy = JSON.parse(JSON.stringify(d));
      copy.id = uid('d');
      copy.name = name;
      copy.createdAt = new Date().toISOString();
      (copy.ingredients || []).forEach(ing => { ing.id = uid('ing'); });
      DB.dishes.push(copy);
      saveDB(); closeModal();
      toast('Копия создана', 'success');
      state.selectedDishId = copy.id;
      render();
    }
  });
}

function openWriteOffDishModal(d){
  if(!d.ingredients || !d.ingredients.length){
    toast('В блюде нет ингредиентов', 'error');
    return;
  }
  openModal({
    title: '🚚 Списание ингредиентов',
    fields: [
      { id: 'portions', label: 'Количество порций', type: 'number', step: '1', value: 1 },
      { id: 'note', label: 'Примечание', type: 'text', value: 'Списание на блюдо «' + d.name + '»' }
    ],
    okLabel: 'Списать',
    onSubmit: () => {
      const portions = parseFloat($('#f-portions').value) || 0;
      if(portions <= 0){ toast('Порций > 0', 'error'); return; }
      const note = ($('#f-note').value || '').trim();
      let count = 0, missing = 0;
      (d.ingredients || []).forEach(ing => {
        const good = getGood(ing.goodId);
        if(!good){ missing++; return; }
        const qty = ingQty(ing) * portions;
        if(qty <= 0) return;
        
        // СПИСЫВАЕМ ПО FIFO
        const realCost = consumeFIFO(ing.goodId, qty);
        
        DB.movements.push({
          id: uid('mv'),
          goodId: ing.goodId,
          date: todayISO(),
          type: 'out',
          qty,
          unitPrice: qty > 0 ? (realCost/qty) : 0,
          total: realCost,
          reason: 'Списание на блюдо',
          note,
          createdAt: new Date().toISOString()
        });
        count++;
      });
      saveDB(true);
      closeModal();
      toast(`Списано ${count} ингредиентов${missing ? ', ' + missing + ' без товара' : ''}`, 'success');
      render();
    }
  });
}

function deleteDish(d){
  if(!confirm(`Удалить блюдо «${d.name}»?`)) return;
  DB.dishes = DB.dishes.filter(x => x.id !== d.id);
  saveDB(true);
  state.selectedDishId = null;
  toast('Блюдо удалено', 'error');
  render();
}

   ============================================================ */

function renderCost(main){
  const q = (state.searchQuery || '').trim().toLowerCase();
  let list = DB.goods.slice();
  if(state.goodsFilter === 'pf') list = list.filter(g => g.isPF);
  else if(state.goodsFilter === 'no-price') list = list.filter(g => avgPrice(g) <= 0);
  else if(state.goodsFilter === 'spread') list = list.filter(g => spreadOf(g) > 15);

  if(q) list = list.filter(g => {
    const cat = getGoodCat(g.category).title.toLowerCase();
    return g.name.toLowerCase().includes(q) || cat.includes(q);
  });

  list.sort((a, b) => {
    if(state.sortField === 'name') return state.sortAsc ? a.name.localeCompare(b.name, 'ru') : b.name.localeCompare(a.name, 'ru');
    if(state.sortField === 'price'){ const r = avgPrice(a) - avgPrice(b); return state.sortAsc ? r : -r; }
    if(state.sortField === 'spread'){ const r = spreadOf(a) - spreadOf(b); return state.sortAsc ? r : -r; }
    return 0;
  });

  const withPrice = DB.goods.filter(g => avgPrice(g) > 0).length;
  const noPrice = DB.goods.filter(g => avgPrice(g) <= 0).length;
  const bigSpread = DB.goods.filter(g => spreadOf(g) > 15).length;

  const rows = list.map((g, i) => {
    const mn = minPrice(g), mx = maxPrice(g), avg = avgPrice(g), sp = spreadOf(g);
    const cat = getGoodCat(g.category);
    const spCls = sp > 30 ? 'fc-bad' : sp > 15 ? 'fc-warn' : 'fc-good';
    return `<tr data-gid="${esc(g.id)}">
      <td class="col-center">${i+1}</td>
      <td>${esc(g.name)}${g.isPF ? '<span class="pf-badge">П/Ф</span>' : ''}</td>
      <td>${cat.icon} ${esc(cat.title)}</td>
      <td class="col-center">${esc(g.unit)}</td>
      <td class="col-center">${countPrices(g)}</td>
      <td class="col-right" style="color:var(--accent-green);">${mn > 0 ? fmt2(mn) : '—'}</td>
      <td class="col-right" style="font-weight:bold;">${avg > 0 ? fmt2(avg) : '—'}</td>
      <td class="col-right" style="color:var(--accent-red);">${mx > 0 ? fmt2(mx) : '—'}</td>
      <td class="col-center">${sp > 0 ? `<span class="fc-badge ${spCls}">+${sp.toFixed(1)}%</span>` : '—'}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="9" class="empty-state">Ничего не найдено</td></tr>`;

  main.innerHTML = `
    <div class="table-top-bar">
      <div><div class="table-title">💰 Себестоимость</div><div class="table-sub">Мин / средняя / макс · разброс</div></div>
      <input type="text" class="search-input" id="searchInput" placeholder="Поиск…" value="${esc(state.searchQuery)}">
    </div>
    <div class="filter-tabs">
      <button class="filter-tab${state.goodsFilter === 'all' ? ' active' : ''}" data-cf="all">Все (${DB.goods.length})</button>
      <button class="filter-tab${state.goodsFilter === 'pf' ? ' active' : ''}" data-cf="pf">П/Ф</button>
      <button class="filter-tab${state.goodsFilter === 'no-price' ? ' active' : ''}" data-cf="no-price">Без цены (${noPrice})</button>
      <button class="filter-tab${state.goodsFilter === 'spread' ? ' active' : ''}" data-cf="spread">Разброс &gt;15% (${bigSpread})</button>
    </div>
    <div class="table-scroll">
      <table class="data-grid" id="costGrid">
        <thead><tr>
          <th class="col-center no-sort" style="width:40px;">#</th>
          <th data-sort="name">Наименование</th>
          <th class="no-sort" style="width:180px;">Категория</th>
          <th class="col-center no-sort" style="width:50px;">Ед.</th>
          <th class="col-center no-sort" style="width:90px;">Поставщиков</th>
          <th class="col-right no-sort" style="width:90px;">Мин</th>
          <th class="col-right" data-sort="price" style="width:100px;">Средняя</th>
          <th class="col-right no-sort" style="width:90px;">Макс</th>
          <th class="col-center" data-sort="spread" style="width:110px;">Разброс</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="hint">💡 Разброс = (макс − мин) / мин × 100. С ценой — <b>${withPrice}</b>, без цены — <b>${noPrice}</b>, разброс &gt; 15% — <b>${bigSpread}</b>.</div>
  `;

  const si = $('#searchInput');
  if(si) si.addEventListener('input', debounce((e) => {
    const el = e.target;
    const pos = el.selectionStart;
    state.searchQuery = el.value;
    renderCost(main);
    const newEl = $('#searchInput');
    if (newEl) { newEl.focus(); newEl.setSelectionRange(pos, pos); }
  }, 150));

  $$('.filter-tab').forEach(t => t.addEventListener('click', () => { state.goodsFilter = t.dataset.cf; renderCost(main); }));
  $$('#costGrid th[data-sort]').forEach(th => th.addEventListener('click', () => {
    const f = th.dataset.sort;
    if(state.sortField === f) state.sortAsc = !state.sortAsc;
    else { state.sortField = f; state.sortAsc = true; }
    renderCost(main);
  }));
  $$('#costGrid tbody tr[data-gid]').forEach(tr => tr.addEventListener('click', () => {
    state.section = 'goods';
    state.selectedGoodId = tr.dataset.gid;
    state.goodTab = 'prices';
    render();
  }));
  $('#statusCount').textContent = `Записей: ${list.length}`;
}

function xmlCell(v){
  const isNum = v != null && v !== '' && !isNaN(v) && isFinite(Number(v));
  return `<Cell><Data ss:Type="${isNum ? 'Number' : 'String'}">${escapeXml(v == null ? '' : v)}</Data></Cell>`;
}
function escapeXml(s){
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;' }[c]));
}
function buildXML(sheetName, rows){
  const rowsXml = rows.map(r => `<Row>${r.map(xmlCell).join('')}</Row>`).join('');
  return `<?xml version="1.0"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
<Worksheet ss:Name="${escapeXml(sheetName)}"><Table>${rowsXml}</Table></Worksheet></Workbook>`;
}

function importJSON(file) {
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.goods || !parsed.categories) throw new Error('Неверный формат файла (нет goods/categories)');
      if (confirm('Вы уверены? Все текущие данные будут заменены данными из файла.')) {
        DB = parsed;
        migrateIfNeeded();
        saveDB(true);
        recalcPF();
        render();
        toast('Данные успешно восстановлены', 'success');
      }
    } catch(err) {
      console.error(err);
      toast('Ошибка чтения файла: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
}

function openNewOrderModal() {
  const dishes = DB.dishes || [];
  
  const html = `
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;">
      <div class="modal-field"><label>Стол</label><input id="ord-table" type="text" value="1"></div>
      <div class="modal-field"><label>Официант</label><input id="ord-waiter" type="text" value=""></div>
    </div>
    <div class="modal-field"><label>Добавить блюдо</label>
      <div style="display:flex; gap:8px;">
        <select id="ord-dish" style="flex:1;">
          <option value="">— выберите блюдо —</option>
          ${dishes.map(d => `<option value="${esc(d.id)}">${esc(d.name)} (${fmt2(d.price)} ₽)</option>`).join('')}
        </select>
        <input id="ord-qty" type="number" value="1" min="1" style="width:80px; text-align:right;">
        <button class="btn primary" id="ord-add-item">＋</button>
      </div>
    </div>
    
    <div style="margin-top:16px; border-top:1px solid var(--border); padding-top:12px;">
      <div style="font-weight:bold; margin-bottom:8px;">Состав заказа:</div>
      <div id="ord-cart-list" style="min-height:50px; background:var(--bg-app); border:1px solid var(--border); border-radius:4px; padding:8px;">
        <div style="color:var(--text-muted); font-size:12px; text-align:center; padding:10px;">Пусто</div>
      </div>
      <div style="margin-top:10px; display:flex; justify-content:space-between; font-weight:bold; font-size:16px;">
        <span>Итого:</span>
        <span id="ord-total" style="color:var(--active-text);">0.00 ₽</span>
      </div>
    </div>
  `;

  let cart = [];

  const renderCart = () => {
    const cartList = $('#ord-cart-list');
    if (cart.length === 0) {
      cartList.innerHTML = `<div style="color:var(--text-muted); font-size:12px; text-align:center; padding:10px;">Пусто</div>`;
    } else {
      cartList.innerHTML = cart.map((item, idx) => `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:4px 0; border-bottom:1px solid var(--border-light);">
          <div>${esc(item.name)} <span style="color:var(--text-muted); font-size:11px;">x${item.qty}</span></div>
          <div style="display:flex; align-items:center; gap:8px;">
            <span style="font-weight:bold;">${fmt2(item.price * item.qty)} ₽</span>
            <button type="button" class="row-btn red" data-remove="${idx}" style="padding:0 4px; height:20px;">×</button>
          </div>
        </div>
      `).join('');
      
      $$('#ord-cart-list [data-remove]').forEach(b => b.addEventListener('click', () => {
        cart.splice(parseInt(b.dataset.remove, 10), 1);
        renderCart();
      }));
    }

    const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
    $('#ord-total').textContent = fmt2(total) + ' ₽';
  };

  openModal({
    title: '🧾 Новый заказ',
    html,
    okLabel: 'Создать заказ',
    onSubmit: () => {
      if (cart.length === 0) { toast('Добавьте хотя бы одно блюдо', 'error'); return; }
      
      const table = $('#ord-table').value.trim() || '1';
      const waiter = $('#ord-waiter').value.trim();
      const num = nextOrderNumber();

      const newOrder = {
        id: uid('ord'),
        number: num,
        date: todayISO(),
        createdAt: new Date().toISOString(),
        table,
        waiter,
        status: 'new',
        items: cart,
        note: ''
      };
      calculateOrderTotals(newOrder);

      DB.orders.push(newOrder);
      saveDB();
      closeModal();
      toast('Заказ №' + num + ' создан', 'success');
      render();
    }
  });

  setTimeout(() => {
    $('#ord-add-item').addEventListener('click', () => {
      const dishId = $('#ord-dish').value;
      const qty = parseInt($('#ord-qty').value, 10) || 1;
      if (!dishId) return;
      
      const dish = getDish(dishId);
      if (!dish) return;

      const existing = cart.find(c => c.dishId === dishId);
      if (existing) {
        existing.qty += qty;
      } else {
        cart.push({ 
          dishId, 
          name: dish.name, 
          qty, 
          price: dish.price || 0, 
          cost: dishCost(dish) 
        });
      }
      $('#ord-dish').value = '';
      $('#ord-qty').value = 1;
      renderCart();
    });
    renderCart();
  }, 50);
}

        <div style="background:${bgColor}; padding:12px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-size:20px; font-weight:bold; color:${borderColor};">№${o.number}</div>
            <div style="font-size:12px; color:var(--text-muted);">Стол: ${esc(o.table)} · ${esc(o.waiter || '—')}</div>
          </div>
          <div style="font-size:12px; color:var(--text-muted);">${new Date(o.createdAt).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'})}</div>
        </div>
        <div style="padding:16px; flex:1; overflow-y:auto;">
          ${itemsHtml}
        </div>
        <div style="padding:12px; border-top:1px solid var(--border); background:var(--bg-app);">
          ${!isCooking 
            ? `<button class="btn primary" style="width:100%; padding:12px; font-size:14px; font-weight:bold;" data-take-order="${esc(o.id)}">🔥 Взять в работу</button>`
            : `<button class="btn" style="width:100%; padding:12px; font-size:14px; font-weight:bold; background:var(--accent-green); color:#000; border-color:var(--accent-green);" data-ready-order="${esc(o.id)}">✅ Готово</button>`
          }
        </div>
      </div>
    `;
  }).join('');

  main.innerHTML = `
    <div class="table-top-bar">
      <div>
        <div class="table-title">👨‍🍳 Кухня</div>
        <div class="table-sub">Активные заказы: ${activeOrders.length}</div>
      </div>
      <button class="btn" id="refreshKitchenBtn">🔄 Обновить</button>
    </div>
    <div class="table-scroll" style="padding:20px; background:var(--bg-app);">
      ${activeOrders.length === 0 ? `
        <div class="empty-state" style="margin-top:50px; font-size:18px; color:var(--text-muted);">Нет активных заказов. Все готово!</div>
      ` : `
        <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:20px; align-items:start;">
          ${cards}
        </div>
      `}
    </div>
  `;

  $('#refreshKitchenBtn').addEventListener('click', () => renderKitchen(main));

  $$('[data-take-order]').forEach(b => b.addEventListener('click', () => {
    const o = getOrder(b.dataset.takeOrder);
    if(o) {
      o.status = 'cooking';
      // Автоматическое списание со склада
      o.items.forEach(item => {
        const dish = getDish(item.dishId);
        if(!dish) return;
        dish.ingredients.forEach(ing => {
          const qtyNeeded = ing.brutto * item.qty;
          consumeFIFO(ing.goodId, qtyNeeded);
        });
      });
      saveDB();
      toast('Заказ взят в работу, склад списан', 'success');
      renderKitchen(main);
    }
  }));

  $$('[data-ready-order]').forEach(b => b.addEventListener('click', () => {
    const o = getOrder(b.dataset.readyOrder);
    if(o) {
      o.status = 'ready';
      saveDB();
      toast('Заказ готов', 'success');
      renderKitchen(main);
    }
  }));

  $('#statusCount').textContent = `Заказов: ${activeOrders.length}`;
}

(function(){

  injectStaffCSS();

  // ============================================================
  // 2. ХЕЛПЕРЫ (включая сжатие фото)
  // ============================================================
  window.staffDishCostCalc = function(dish) {
    if (!dish || !dish.ingredients) return 0;
    return dish.ingredients.reduce((sum, ing) => {
      const good = getGood(ing.goodId);
      if (!good) return sum;
      return sum + (ing.brutto * avgPrice(good));
    }, 0);
  };

  function getStaffDishesByIds(ids) {
    if (!ids) return [];
    return ids.map(id => (DB.staffDishes || []).find(d => d.id === id)).filter(Boolean);
  }

  // Функция сжатия фото перед сохранением в localStorage
  function compressImage(file, maxWidth, callback) {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        
        // Сжимаем в jpeg с качеством 0.7
        callback(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // Функция автоматической генерации меню на 4 недели
  function buildSeedStaffMenu(staffDishes) {
    const menu = { weeks: [] };
    const dishesByCat = {};
    
    (staffDishes || []).forEach(d => {
      if (!dishesByCat[d.category]) dishesByCat[d.category] = [];
      dishesByCat[d.category].push(d);
    });

    const getRandom = (arr) => arr && arr.length ? arr[Math.floor(Math.random() * arr.length)] : null;

    for (let w = 1; w <= 4; w++) {
      const week = { label: `Неделя ${w}`, days: [] };
      for (let d = 0; d < 7; d++) {
        const day = {
          dayIndex: d,
          meals: { breakfast: [], lunch: [], dinner: [] }
        };

        const bCats = STAFF_MEAL_CATEGORIES['breakfast'] || [];
        bCats.forEach(cat => {
          const dish = getRandom(dishesByCat[cat]);
          if (dish) day.meals.breakfast.push(dish.id);
        });

        const lCats = STAFF_MEAL_CATEGORIES['lunch'] || [];
        lCats.forEach(cat => {
          const dish = getRandom(dishesByCat[cat]);
          if (dish) day.meals.lunch.push(dish.id);
        });

        const dCats = STAFF_MEAL_CATEGORIES['dinner'] || [];
        dCats.forEach(cat => {
          const dish = getRandom(dishesByCat[cat]);
          if (dish) day.meals.dinner.push(dish.id);
        });

        week.days.push(day);
      }
      menu.weeks.push(week);
    }
    return menu;
  }

  // ============================================================
  // 3. ИНТЕГРАЦИЯ С SIDEBAR
  // ============================================================
  if (!window.__staffSidebarWrapped && typeof window.renderSidebar === 'function') {
    window.__staffSidebarWrapped = true;
    const _origSidebar = window.renderSidebar;

    window.renderSidebar = function() {
      const r = _origSidebar.apply(this, arguments);

      const sidebar = document.getElementById('sidebar');
      if (!sidebar) return r;

      if (!document.getElementById('staff-nav-btn')) {
        const kitchenBtn = Array.from(sidebar.querySelectorAll('.tree-node.root'))
          .find(el => el.textContent.includes('Кухня'));

        const div = document.createElement('div');
        div.className = 'tree-node root';
        div.id = 'staff-nav-btn';
        div.innerHTML = `
          <span class="tree-arrow">✦</span>
          <span class="tree-icon" style="color:#22c55e;">🍲</span>
          <span>Staff питание</span>
        `;
        div.addEventListener('click', () => {
          state.section = 'staff';
          state.activeGoodsCat = null;
          state.activeMenuCat = null;
          state.selectedSupplier = null;
          state.selectedGoodId = null;
          state.selectedDishId = null;
          state.searchQuery = '';
          render();
        });

        if (kitchenBtn && kitchenBtn.parentNode) {
          kitchenBtn.parentNode.insertBefore(div, kitchenBtn.nextSibling);
        } else {
          sidebar.appendChild(div);
        }
      }

      const staffBtn = document.getElementById('staff-nav-btn');
      if (staffBtn) {
        if (state.section === 'staff') staffBtn.classList.add('active');
        else staffBtn.classList.remove('active');
      }

      return r;
    };
  }

  // ============================================================
  // 4. ИНТЕГРАЦИЯ С MAIN
  // ============================================================
  if (!window.__staffMainWrapped && typeof window.renderMain === 'function') {
    window.__staffMainWrapped = true;
    const _origMain = window.renderMain;

    window.renderMain = function() {
      if (state.section === 'staff') {
        renderStaffModule();
        const s1 = document.getElementById('statusSection');
        const s2 = document.getElementById('statusCount');
        const s3 = document.getElementById('statusSelection');
        if (s1) s1.textContent = 'Staff питание';
        if (s2) s2.textContent = '';
        if (s3) s3.textContent = '';
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      return _origMain.apply(this, arguments);
    };
  }

  // ============================================================
  // 5. ГЛАВНЫЙ РЕНДЕР МОДУЛЯ
  // ============================================================
  function renderStaffModule() {
    const main = document.getElementById('mainArea');
    if (!main) return;

    if (!DB.staffDishes || DB.staffDishes.length === 0) {
        if (typeof buildSeedStaffDishes === 'function') {
            DB.staffDishes = buildSeedStaffDishes(DB.goods);
            saveDB(true);
        }
    }
    
    let isMenuEmpty = true;
    if (DB.staffMenu && DB.staffMenu.weeks) {
        for (const w of DB.staffMenu.weeks) {
            for (const d of w.days) {
                if (d.meals.breakfast.length > 0 || d.meals.lunch.length > 0 || d.meals.dinner.length > 0) {
                    isMenuEmpty = false; 
                    break;
                }
            }
            if (!isMenuEmpty) break;
        }
    }

    if (isMenuEmpty || !DB.staffMenu || !DB.staffMenu.weeks) {
        DB.staffMenu = buildSeedStaffMenu(DB.staffDishes);
        saveDB(true);
    }

    let html = `
      <div class="table-top-bar">
        <div>
          <div class="table-title">🍲 Питание персонала</div>
          <div class="table-sub">Планирование меню, списание, конструктор рациона</div>
        </div>
      </div>
      
      <div class="staff-tabs">
        <button class="staff-tab ${staffState.tab === 'menu' ? 'active' : ''}" data-stab="menu">📅 Меню на неделю</button>
        <button class="staff-tab ${staffState.tab === 'ttk' ? 'active' : ''}" data-stab="ttk">📋 ТТК (Справочник)</button>
        <button class="staff-tab ${staffState.tab === 'builder' ? 'active' : ''}" data-stab="builder">🧮 Конструктор</button>
        <button class="staff-tab ${staffState.tab === 'writeoff' ? 'active' : ''}" data-stab="writeoff">🚚 Списание</button>
        <button class="staff-tab ${staffState.tab === 'history' ? 'active' : ''}" data-stab="history">📜 История</button>
      </div>

      <div class="table-scroll" id="staffContent" style="padding-bottom: 40px;">
    `;

    if (staffState.tab === 'menu')          html += renderStaffMenuTab();
    else if (staffState.tab === 'ttk')      html += renderStaffTTKTab();
    else if (staffState.tab === 'builder')  html += renderStaffBuilderTab();
    else if (staffState.tab === 'writeoff') html += renderStaffWriteOffTab();
    else if (staffState.tab === 'history')  html += renderStaffHistoryTab();

    html += `</div>`;
    main.innerHTML = html;

    document.querySelectorAll('[data-stab]').forEach(t => {
      t.addEventListener('click', () => {
        staffState.tab = t.dataset.stab;
        renderStaffModule();
      });
    });

    if (staffState.tab === 'menu')          bindStaffMenuEvents();
    else if (staffState.tab === 'ttk')      bindStaffTTKEvents();
    else if (staffState.tab === 'builder')  bindStaffBuilderEvents();
    else if (staffState.tab === 'writeoff') bindStaffWriteOffEvents();
    else if (staffState.tab === 'history')  bindStaffHistoryEvents();
  }

  // ============================================================
  // 6. ВКЛАДКА «МЕНЮ НА НЕДЕЛЮ»
  // ============================================================
  function renderStaffMenuTab() {
    const data = DB.staffMenu || { weeks: [] };
    const weekIdx = staffState.week - 1;
    const weekData = data.weeks[weekIdx];
    if (!weekData) return '<div class="empty-state">Ошибка структуры меню</div>';

    let html = `
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px;">
        <div style="display: flex; gap: 6px;">
          ${[1,2,3,4].map(w => `<button class="btn ${staffState.week === w ? 'primary' : ''}" data-sweek="${w}">Неделя ${w}</button>`).join('')}
        </div>
        <div style="display: flex; gap: 8px;">
          <button class="btn" id="staffAutoFillBtn" style="border-color:var(--accent-gold); color:var(--accent-gold);">🎲 Заполнить автоматически</button>
          <button class="btn" id="staffPrintMenuBtn">🖨 Печать меню</button>
          <button class="btn danger" id="staffClearWeekBtn">× Очистить неделю</button>
        </div>
      </div>
      <table class="staff-menu-grid">
        <thead>
          <tr>
            <th class="meal-col">Приём пищи</th>
            ${STAFF_DAYS_SHORT.map((d, i) => `
              <th class="day-col">
                ${d} <span style="font-size:9px;display:block;color:var(--text-muted);">${i+1}</span>
                <button class="btn" data-print-day="${i}" style="margin-top:4px; padding:2px 6px; font-size:10px; display:block; width:100%;" title="Распечатать все ТТК за этот день">🖨 ТТК</button>
              </th>
            `).join('')}
          </tr>
        </thead>
        <tbody>
    `;

    const meals = [
      { id: 'breakfast', label: '🍳 Завтрак' },
      { id: 'lunch',     label: '🍲 Обед' },
      { id: 'dinner',    label: '🍽 Ужин' }
    ];

    meals.forEach(meal => {
      html += `<tr><td style="text-align: center; font-weight: bold; background: var(--bg-panel); color: var(--text-main);">${meal.label}</td>`;

      for (let d = 0; d < 7; d++) {
        const dayData = weekData.days[d];
        const dishIds = (dayData && dayData.meals && dayData.meals[meal.id]) ? dayData.meals[meal.id] : [];
        const dishes = getStaffDishesByIds(dishIds);

        let cellHtml = '';
        let totalCost = 0;
        dishes.forEach(dish => {
          const cost = staffDishCostCalc(dish);
          totalCost += cost;
          cellHtml += `<div class="staff-dish-chip">${esc(dish.name)} <span class="cost">${fmt2(cost)} ₽</span></div>`;
        });
        if (!dishes.length) {
          cellHtml = `<div style="height: 100%; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 10px;">+ Добавить</div>`;
        }

        html += `<td>
          <div class="staff-menu-cell" data-sday="${d}" data-smeal="${meal.id}">
            ${cellHtml}
            ${totalCost > 0 ? `<div class="staff-day-cost">Итого: ${fmt2(totalCost)} ₽</div>` : ''}
          </div>
        </td>`;
      }
      html += `</tr>`;
    });

    html += `</tbody></table>`;

    const dayTotals = [0,0,0,0,0,0,0];
    for (let dayIdx = 0; dayIdx < 7; dayIdx++) {
      const dayData = weekData.days[dayIdx];
      if (!dayData) continue;
      ['breakfast', 'lunch', 'dinner'].forEach(mealId => {
        const dishIds = (dayData.meals && dayData.meals[mealId]) ? dayData.meals[mealId] : [];
        getStaffDishesByIds(dishIds).forEach(dish => {
          dayTotals[dayIdx] += staffDishCostCalc(dish);
        });
      });
    }

    html += `<div style="display: grid; grid-template-columns: 120px repeat(7, 1fr); gap: 1px; margin-top: 10px;">
      <div style="font-weight: bold; font-size: 11px; color: var(--text-muted); text-transform: uppercase; display: flex; align-items: center; justify-content: center;">Сумма за день</div>
      ${dayTotals.map(t => `<div style="text-align: center; font-weight: bold; color: var(--accent-orange); font-size: 12px; padding: 4px; background: var(--bg-panel); border-radius: 4px;">${fmt2(t)} ₽</div>`).join('')}
    </div>`;

    return html;
  }

  function bindStaffMenuEvents() {
    document.querySelectorAll('[data-sweek]').forEach(b => b.addEventListener('click', () => {
      staffState.week = parseInt(b.dataset.sweek, 10);
      renderStaffModule();
    }));

    const autoFillBtn = document.getElementById('staffAutoFillBtn');
    if (autoFillBtn) autoFillBtn.addEventListener('click', () => {
      if (!confirm('Заполнить все недели случайными блюдами из справочника? Текущее меню будет перезаписано.')) return;
      DB.staffMenu = buildSeedStaffMenu(DB.staffDishes);
      saveDB(true);
      renderStaffModule();
      toast('Меню успешно заполнено', 'success');
    });

    const clearBtn = document.getElementById('staffClearWeekBtn');
    if (clearBtn) clearBtn.addEventListener('click', () => {
      if (!confirm('Очистить все блюда на этой неделе?')) return;
      const weekData = DB.staffMenu.weeks[staffState.week - 1];
      if (weekData) {
        weekData.days.forEach(day => { day.meals = { breakfast: [], lunch: [], dinner: [] }; });
        saveDB();
        renderStaffModule();
        toast('Меню недели очищено', 'success');
      }
    });

    const printBtn = document.getElementById('staffPrintMenuBtn');
    if (printBtn) printBtn.addEventListener('click', () => printStaffWeeklyMenu(staffState.week));

    document.querySelectorAll('[data-print-day]').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            printAllTTKsForDay(parseInt(btn.dataset.printDay, 10));
        });
    });

    document.querySelectorAll('.staff-menu-cell').forEach(cell => {
      cell.addEventListener('click', () => {
        openStaffMealSelectionModal(
          parseInt(cell.dataset.sday, 10),
          cell.dataset.smeal
        );
      });

  function openStaffMealSelectionModal(dayIdx, mealType) {
    const weekData = DB.staffMenu.weeks[staffState.week - 1];
    const dayData = weekData.days[dayIdx];
    const currentIds = (dayData.meals && dayData.meals[mealType]) ? dayData.meals[mealType] : [];

    const allowedCats = STAFF_MEAL_CATEGORIES[mealType] || [];
    const availableDishes = (DB.staffDishes || []).filter(d => allowedCats.includes(d.category));

    const grouped = {};
    availableDishes.forEach(d => {
      if (!grouped[d.category]) grouped[d.category] = [];
      grouped[d.category].push(d);
    });

    let html = `<div style="margin-bottom: 12px; font-weight: bold; color: var(--active-text);">
      ${STAFF_DAYS_FULL[dayIdx]} · ${STAFF_MEAL_LABELS[mealType]}
    </div>`;
    html += `<div class="meal-selector-list">`;

    allowedCats.forEach(catId => {
      const cat = STAFF_CATEGORIES.find(c => c.id === catId);
      const dishes = (grouped[catId] || []).slice().sort((a, b) => a.name.localeCompare(b.name, 'ru'));
      if (!dishes.length) return;

      html += `<div style="background: var(--bg-grid-header); padding: 4px 12px; font-size: 10px; font-weight: bold; text-transform: uppercase; color: var(--text-muted); position: sticky; top: 0; z-index: 1;">${cat.icon} ${cat.title}</div>`;

      dishes.forEach(d => {
        const isChecked = currentIds.includes(d.id) ? 'checked' : '';
        const cost = staffDishCostCalc(d);
        
        html += `<div class="meal-selector-item" style="display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--border-light);">
          <input type="checkbox" value="${d.id}" ${isChecked} id="cb-${d.id}" style="width:16px; height:16px; cursor:pointer; accent-color:var(--active-border);">
          <label for="cb-${d.id}" style="flex:1; cursor:pointer; margin:0;">
            <div style="font-weight: 600; font-size: 12px;">${esc(d.name)}</div>
            <div style="font-size: 10px; color: var(--text-muted);">${d.output} г</div>
          </label>
          <button type="button" class="btn" data-print-dish="${d.id}" style="font-size: 11px; padding: 4px 8px; background: var(--bg-app); border: 1px solid var(--border); color: var(--text-main); cursor: pointer; white-space: nowrap;">🖨 Печать</button>

        </div>`;
      });
    });
    html += `</div>`;

    openModal({
      title: 'Выбор блюд: ' + STAFF_MEAL_LABELS[mealType],
      html: html,
      wide: true,
      okLabel: 'Сохранить',
      onSubmit: () => {
        const selectedIds = [];
        document.querySelectorAll('.meal-selector-item input[type="checkbox"]:checked').forEach(cb => {
          selectedIds.push(cb.value);
        });
        if (!weekData.days[dayIdx].meals) weekData.days[dayIdx].meals = {};
        weekData.days[dayIdx].meals[mealType] = selectedIds;
        saveDB();
        closeModal();
        renderStaffModule();
        toast('Меню обновлено', 'success');
      }
    });

    setTimeout(() => {
        document.querySelectorAll('[data-print-dish]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const d = DB.staffDishes.find(x => x.id === btn.dataset.printDish);
                if (d) printStaffTTK(d);
            });
        });
    }, 50);

  function renderStaffBuilderTab() {

    const dishes = DB.staffDishes || [];

    dishes.forEach(d => {
      if (!grouped[d.category]) grouped[d.category] = [];
      grouped[d.category].push(d);
    });

    STAFF_CATEGORIES.forEach(cat => {
      const list = grouped[cat.id];
      if (!list || !list.length) return;
      html += `<div style="background: var(--bg-grid-header); padding: 6px 12px; font-size: 11px; font-weight: bold; text-transform: uppercase; color: var(--active-text);">${cat.icon} ${cat.title}</div>`;

      list.slice().sort((a, b) => a.name.localeCompare(b.name, 'ru')).forEach(d => {

        const qty = staffState.builderCart[d.id] || 0;
        html += `<div class="staff-builder-row">
          <div style="text-align: center; font-weight: bold; color: var(--active-text);">${qty || ''}</div>
          <div style="font-weight: 600;">${esc(d.name)}</div>

          <input type="number" min="0" step="1" value="${qty || ''}" placeholder="0" data-bqty="${d.id}">
        </div>`;
      });
    });

    html += `</div>`;

    let totalCost = 0;
    let totalQty = 0;
    Object.entries(staffState.builderCart).forEach(([id, qty]) => {
      const dish = dishes.find(x => x.id === id);
      if (dish && qty > 0) {
        totalCost += staffDishCostCalc(dish) * qty;
        totalQty += qty;
      }
    });

    html += `
      <div style="margin-top: 20px; display: flex; justify-content: space-between; align-items: center; padding: 16px; background: var(--bg-panel); border: 2px solid var(--active-border); border-radius: 8px; flex-wrap: wrap; gap: 12px;">

        </div>
      </div>
    `;

    return html;
  }

  function bindStaffBuilderEvents() {
    document.querySelectorAll('[data-bqty]').forEach(inp => {
      inp.addEventListener('input', () => {
        const id = inp.dataset.bqty;
        const v = parseInt(inp.value, 10) || 0;
        if (v > 0) staffState.builderCart[id] = v;
        else delete staffState.builderCart[id];
        
        let totalCost = 0;
        let totalQty = 0;
        Object.entries(staffState.builderCart).forEach(([bid, qty]) => {
          const dish = DB.staffDishes.find(x => x.id === bid);
          if (dish && qty > 0) {

           if (boldEl) boldEl.textContent = v || '';

  // ============================================================
  // 9. ВКЛАДКА «СПИСАНИЕ»
  // ============================================================
  function renderStaffWriteOffTab() {
    const weekIdx = staffState.woWeek - 1;
    const dayIdx = staffState.woDay;
    const mealType = staffState.woMeal;

    let html = `
      <div class="staff-wo-form">
        <div class="field">
          <label>Неделя</label>
          <select id="woWeek">
            ${[1,2,3,4].map(w => `<option value="${w}" ${staffState.woWeek === w ? 'selected' : ''}>Неделя ${w}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>День недели</label>
          <select id="woDay">
            ${STAFF_DAYS_FULL.map((d, i) => `<option value="${i}" ${staffState.woDay === i ? 'selected' : ''}>${d}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Приём пищи</label>
          <select id="woMeal">
            ${Object.keys(STAFF_MEAL_LABELS).map(k => `<option value="${k}" ${staffState.woMeal === k ? 'selected' : ''}>${STAFF_MEAL_LABELS[k]}</option>`).join('')}

        </div>

      </div>

    const weekData = DB.staffMenu.weeks[weekIdx];
    if (!weekData) return html + '<div class="empty-state">Неделя не найдена</div>';

    const dayData = weekData.days[dayIdx];
    const mealsToProcess = mealType === 'full' ? ['breakfast', 'lunch', 'dinner'] : [mealType];
    const targetDishes = [];
    mealsToProcess.forEach(m => {
      const ids = (dayData.meals && dayData.meals[m]) ? dayData.meals[m] : [];
      getStaffDishesByIds(ids).forEach(d => targetDishes.push({ dish: d, meal: m }));
    });

    if (!targetDishes.length) {
      return html + `<div class="empty-state" style="margin-top: 20px; padding: 40px; border: 2px dashed var(--border); border-radius: 12px;">На этот день и приём пищи не назначено меню.<br><br>Зайдите во вкладку "Меню на неделю" и выберите блюда.</div>`;
    }

    const aggregated = {};
    targetDishes.forEach(item => {
      item.dish.ingredients.forEach(ing => {
        const g = getGood(ing.goodId);
        if (!g) return; 
        if (!aggregated[ing.goodId]) {
          aggregated[ing.goodId] = { brutto: 0, name: g.name, unit: g.unit };
        }
        aggregated[ing.goodId].brutto += ing.brutto;
      });
    });

    const people = staffState.woPeople;
    let totalSum = 0;
    let rows = '';

    Object.keys(aggregated).forEach(goodId => {
      const data = aggregated[goodId];
      const good = getGood(goodId);
      if (!good) return;
      const price = avgPrice(good);
      const totalQty = data.brutto * people;
      const sum = totalQty * price;
      totalSum += sum;

          <tbody>${rows}</tbody>
          <tfoot>
            <tr>
              <td colspan="4" style="text-align: right; font-weight: bold; padding: 10px;">ИТОГО:</td>
              <td class="col-right" style="font-weight: bold; color: var(--accent-orange); font-size: 16px; padding: 10px;">${fmt2(totalSum)} ₽</td>

          </tfoot>
        </table>
      </div>

    staffState._woTemp = {
      aggregated, people,
      week: staffState.woWeek, day: staffState.woDay, meal: staffState.woMeal,

  function bindStaffWriteOffEvents() {
    const weekSel  = document.getElementById('woWeek');
    const daySel   = document.getElementById('woDay');
    const mealSel  = document.getElementById('woMeal');
    const peopleInp = document.getElementById('woPeople');

    const update = () => {
      staffState.woWeek   = parseInt(weekSel.value, 10);
      staffState.woDay    = parseInt(daySel.value, 10);
      staffState.woMeal   = mealSel.value;
      staffState.woPeople = Math.max(1, parseInt(peopleInp.value, 10) || 30);
      renderStaffModule();
    };

    if (weekSel)   weekSel.addEventListener('change', update);
    if (daySel)    daySel.addEventListener('change', update);
    if (mealSel)   mealSel.addEventListener('change', update);
    if (peopleInp) peopleInp.addEventListener('change', update);

    const refreshBtn = document.getElementById('woRefreshBtn');
    if (refreshBtn) refreshBtn.addEventListener('click', update);

    const processBtn = document.getElementById('woProcessBtn');
    if (processBtn) processBtn.addEventListener('click', () => {
      if (!staffState._woTemp) return;
      const { aggregated, people, week, day, meal } = staffState._woTemp;
      if (!confirm(`Вы уверены, что хотите списать продукты со склада на ${people} человек?`)) return;

      const now = new Date().toISOString();
      const woId = uid('swo');
      const items = [];
      let actualTotalSum = 0;

      Object.keys(aggregated).forEach(goodId => {
        const data = aggregated[goodId];
        const good = getGood(goodId);
        if (!good) return;
        const qty = data.brutto * people;
        if (qty <= 0) return;

        const realCost = consumeFIFO(goodId, qty);
        const costToUse = realCost > 0 ? realCost : (qty * avgPrice(good));
        actualTotalSum += costToUse;

        DB.movements.push({
          id: uid('mv'), goodId, date: todayISO(), type: 'out',
          qty, unitPrice: qty > 0 ? (costToUse / qty) : 0, total: costToUse,
          reason: 'Питание персонала',
          note: `Неделя ${week}, ${STAFF_DAYS_SHORT[day]}, ${STAFF_MEAL_LABELS[meal]}, ${people} чел.`,
          createdAt: now
        });

        items.push({ goodId, name: good.name, unit: good.unit, qty, sum: costToUse });
      });

      if (!DB.staffWriteOffs) DB.staffWriteOffs = [];
      DB.staffWriteOffs.push({
        id: woId,
        date: todayISO(),
        createdAt: now,
        week, dayIdx: day, mealType: meal, people,
        items, totalSum: actualTotalSum
      });

      saveDB(true);
      toast('Продукты успешно списаны со склада!', 'success');
      printStaffAkt(DB.staffWriteOffs[DB.staffWriteOffs.length - 1]);
      staffState.tab = 'history';
      renderStaffModule();
    });
  }

  function exportStaffBuilderToExcel() {
    const cart = staffState.builderCart;
    if (!Object.keys(cart).length) { toast('Корзина пуста', 'error'); return; }

    const rows = [
      ['РАЦИОН ПИТАНИЯ ПЕРСОНАЛА'],
      ['Дата: ' + new Date().toLocaleDateString('ru-RU')],
      [],
      ['Блюдо','Порций','Себестоимость 1 порц.','Сумма']
    ];
    let total = 0;
    Object.keys(cart).forEach(id => {
      const qty = cart[id];
      const dish = DB.staffDishes.find(x => x.id === id);
      if (!dish || qty <= 0) return;
      const cost = staffDishCostCalc(dish);
      const sum = cost * qty;
      total += sum;
      rows.push([dish.name, qty, +cost.toFixed(2), +sum.toFixed(2)]);
    });
    rows.push([], ['','','ИТОГО:', +total.toFixed(2)]);

    download('Staff-Рацион-' + todayISO() + '.xls', buildXML('Рацион', rows), 'application/vnd.ms-excel');
    toast('Excel сохранен', 'success');
  }

            <button class="btn primary" id="proc-add-btn" style="padding:8px; font-size:14px; height:38px;">＋</button>
          </div>
        </div>

        <!-- ТАБЛИЦА ТОВАРОВ -->
        <table class="price-grid" style="margin-bottom:20px;">
          <thead>
            <tr>
              <th>Товар</th>
              <th class="col-right" style="width:120px;">Кол-во</th>
              <th class="col-right" style="width:120px;">Цена</th>
              <th class="col-right" style="width:120px;">Сумма</th>

          <tbody>${cartHtml || `<tr><td colspan="5" class="empty-state" style="padding:20px;">Накладная пуста. Добавьте товары выше.</td></tr>`}</tbody>

          <div style="font-size:20px; font-weight:bold;">
            Итого: <span style="color:var(--active-text);">${fmt2(totalSum)} ₽</span>
          </div>
          <button class="btn primary" id="proc-save-btn" style="padding:12px 24px; font-size:16px; ${totalSum === 0 ? 'opacity:0.5; cursor:not-allowed;' : ''}" ${totalSum === 0 ? 'disabled' : ''}>🚚 Оприходовать</button>

    const photoHtml = hasPhoto ? `
      <div style="background:var(--bg-panel); border:1px solid var(--border); border-radius:8px; height:100%; display:flex; flex-direction:column; overflow:hidden; position:sticky; top:0;">
        <div style="padding:10px 16px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; background:var(--bg-grid-header);">

          <button class="btn danger" id="proc-clear-photo" style="padding:4px 8px; font-size:11px;">Удалить фото</button>
        </div>
        <div style="flex:1; overflow:auto; padding:10px; text-align:center; background:#000;">

        </div>
      </div>
    ` : '';

    main.innerHTML = `
      <div class="table-top-bar">
        <div>
          <div class="table-title">📥 Приходная накладная</div>
          <div class="table-sub">Массовое оприходование товара на склад</div>
        </div>
        <div style="display:flex; gap:8px;">
          <input type="file" id="proc-photo-input" accept="image/*" style="display:none;">
          <button class="btn" id="proc-upload-photo-btn">📷 Прикрепить фото</button>
        </div>
      </div>
      
      <div class="table-scroll" style="padding:20px;">
        <div style="${layoutStyle}">
          ${formHtml}
          ${photoHtml}
        </div>
      </div>
    `;

    // ============================================================
    // 4. ОБРАБОТЧИКИ СОБЫТИЙ
    // ============================================================
    
    // Загрузка фото
    const photoInput = document.getElementById('proc-photo-input');
    document.getElementById('proc-upload-photo-btn').addEventListener('click', () => photoInput.click());
    
    photoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      if (file.size > 5 * 1024 * 1024) {
        toast('Файл слишком большой (макс. 5 МБ)', 'error');
        return;
      }

      const reader = new FileReader();
      reader.onload = (ev) => {
        procurementState.photo = ev.target.result;
        renderProcurementModule();
      };
      reader.readAsDataURL(file);
    });

    // Удаление фото
    const clearPhotoBtn = document.getElementById('proc-clear-photo');
    if (clearPhotoBtn) {
      clearPhotoBtn.addEventListener('click', () => {
        procurementState.photo = null;
        renderProcurementModule();
      });
    }

    // Ввод данных
    document.getElementById('proc-supplier').addEventListener('input', (e) => {
      procurementState.supplier = e.target.value;
    });
    
    document.getElementById('proc-date').addEventListener('change', (e) => {
      procurementState.date = e.target.value;
    });

    // Автоподстановка цены
    document.getElementById('proc-good').addEventListener('change', (e) => {
      const good = getGood(e.target.value);
      if (good) {
        const price = avgPrice(good);
        if (price > 0) {
          document.getElementById('proc-price').value = price;
        }
      }
    });

    // Добавление товара
    document.getElementById('proc-add-btn').addEventListener('click', () => {
      const goodId = document.getElementById('proc-good').value;
      const qty = parseFloat(document.getElementById('proc-qty').value) || 0;
      const price = parseFloat(document.getElementById('proc-price').value) || 0;
      
      if (!goodId) { toast('Выберите товар', 'error'); return; }
      if (qty <= 0) { toast('Количество > 0', 'error'); return; }
      if (price <= 0) { toast('Цена > 0', 'error'); return; }

      const good = getGood(goodId);
      
      const existing = procurementState.cart.find(c => c.goodId === goodId);
      if (existing) {
        existing.qty = round3(existing.qty + qty);
        existing.price = price; 
      } else {
        procurementState.cart.push({
          goodId,
          name: good.name,
          unit: good.unit,
          qty,
          price
        });
      }
      
      document.getElementById('proc-good').value = '';
      document.getElementById('proc-qty').value = 1;
      document.getElementById('proc-price').value = 0;
      
      renderProcurementModule();
    });

    // Удаление строки
    document.querySelectorAll('[data-remove-cart]').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.removeCart, 10);
        procurementState.cart.splice(idx, 1);
        renderProcurementModule();
      });
    });

    // ОПРИХОДОВАНИЕ
    const saveBtn = document.getElementById('proc-save-btn');
    if (saveBtn) {
        saveBtn.addEventListener('click', () => {
          if (!procurementState.cart.length) { toast('Накладная пуста', 'error'); return; }
          if (!procurementState.supplier.trim()) { toast('Введите имя поставщика', 'error'); return; }
          
          if (!confirm(`Вы уверены, что хотите оприходовать товары на сумму ${fmt2(totalSum)} ₽?`)) return;

          const now = new Date().toISOString();
          const invId = uid('inv');
          const invNumber = (DB.invoices.length > 0 ? Math.max(...DB.invoices.map(i => i.number || 0)) : 0) + 1;
          
          procurementState.cart.forEach(item => {
            const mvId = uid('mv');
            
            DB.movements.push({
              id: mvId, goodId: item.goodId, date: procurementState.date, type: 'in',
              qty: item.qty, unitPrice: item.price, total: item.qty * item.price,
              supplier: procurementState.supplier, note: `Накладная №${invNumber}`, createdAt: now
            });

            DB.batches.push({
              id: uid('b'), movementId: mvId, goodId: item.goodId, date: procurementState.date,
              qty: item.qty, remainingQty: item.qty, price: item.price
            });

            const good = getGood(item.goodId);
            if (good) {
              const existing = good.prices.find(p => p.supplier === procurementState.supplier);
              if (existing) {
                existing.price = item.price;
                existing.date = procurementState.date;
              } else {
                good.prices.push({ supplier: procurementState.supplier, price: item.price, date: procurementState.date });
              }
            }
          });

          if (!DB.suppliers.includes(procurementState.supplier)) {
            DB.suppliers.push(procurementState.supplier);
          }

          DB.invoices.push({
            id: invId,
            number: invNumber,
            date: procurementState.date,
            supplier: procurementState.supplier,
            items: procurementState.cart,
            total: totalSum,
            createdAt: now
          });

          saveDB(true);
          recalcPF(); 
          
          // Очищаем всё, включая фото
          procurementState.cart = [];
          procurementState.date = todayISO();
          procurementState.photo = null;
          
          toast('Накладная успешно оприходована!', 'success');
          renderProcurementModule();
        });
    }
  }
})();

      const cat = getMenuCat(d.categoryId);
      return `<tr>
        <td><span style="color:var(--text-muted); font-size:10px;">${cat.title}</span><br><b>${esc(d.name)}</b></td>
        <td class="col-right"><input type="number" step="1" min="0" value="0" class="req-alacarte-qty" data-id="${d.id}" style="width:70px; padding:4px; text-align:right; background:var(--bg-app); border:1px solid var(--border); border-radius:4px;"></td>
        <td class="col-center"><input type="checkbox" class="req-buffet-cb" value="${d.id}" style="width:16px; height:16px; cursor:pointer;"></td>
      </tr>`;
    }).join('');

    const html = `
      <div style="display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:12px; margin-bottom:16px;">
        <div class="modal-field" style="margin:0;">
          <label>Гостей на шведке</label>
          <input type="number" id="req-buffet-guests" value="0" min="0" style="padding:8px; font-size:14px;">
        </div>
        <div class="modal-field" style="margin:0;">
          <label>Сотрудников (Staff)</label>
          <input type="number" id="req-staff-people" value="${DB.staffSettings?.people || 30}" min="0" style="padding:8px; font-size:14px;">
        </div>
        <div class="modal-field" style="margin:0;">
          <label>Неделя Staff</label>
          <select id="req-staff-week" style="padding:8px; font-size:14px;">
            ${[1,2,3,4].map(w => `<option value="${w}">Неделя ${w}</option>`).join('')}
          </select>
        </div>
        <div class="modal-field" style="margin:0;">
          <label>День Staff меню</label>
          <select id="req-staff-day" style="padding:8px; font-size:14px;">
            ${STAFF_DAYS_FULL.map((d, i) => `<option value="${i}">${d}</option>`).join('')}
          </select>
        </div>
      </div>

      <div style="font-weight:bold; font-size:14px; margin-bottom:8px; color:var(--active-text);">Выбор блюд:</div>
      <div style="max-height:400px; overflow-y:auto; border:1px solid var(--border); border-radius:6px;">
        <table class="price-grid" style="margin:0;">
          <thead style="position:sticky; top:0; z-index:10;">
            <tr>
              <th>Блюдо</th>
              <th class="col-right" style="width:100px;">Порций (А-ля карт)</th>
              <th class="col-center" style="width:100px;">На Шведку</th>
            </tr>
          </thead>
          <tbody>${dishesHtml}</tbody>
        </table>
      </div>
      <div class="modal-field-hint" style="margin-top:8px;">
        💡 Для шведки: 1 галочка = 1 порция на 1 гостя. Программа перемножит ингредиенты на количество гостей.
      </div>
    `;

    openModal({
      title: '🎯 Формирование заявки',
      html: html,
      xwide: true,
      okLabel: 'Рассчитать',
      onSubmit: () => {
        const buffetGuests = parseInt(document.getElementById('req-buffet-guests').value, 10) || 0;
        const staffPeople = parseInt(document.getElementById('req-staff-people').value, 10) || 0;
        const staffWeek = parseInt(document.getElementById('req-staff-week').value, 10) || 1;
        const staffDay = parseInt(document.getElementById('req-staff-day').value, 10) || 0;
        
        calculateNeeds(buffetGuests, staffPeople, staffWeek, staffDay);
      }
    });
  }

  function calculateNeeds(buffetGuests, staffPeople, staffWeek, staffDay) {
    const needs = {}; // { goodId: totalBrutto }

    const addIngredient = (goodId, qty) => {
      if (!goodId) return;
      if (!needs[goodId]) needs[goodId] = 0;
      needs[goodId] += qty;
    };

    // 1. А-ля карт (Основное меню)
    document.querySelectorAll('.req-alacarte-qty').forEach(inp => {
      const qty = parseFloat(inp.value) || 0;
      if (qty <= 0) return;
      const dish = getDish(inp.dataset.id);
      if (!dish) return;
      (dish.ingredients || []).forEach(ing => {
        addIngredient(ing.goodId, ing.brutto * qty);
      });
    });

    // 2. Шведка (Берем блюда с галочками и умножаем на гостей)
    document.querySelectorAll('.req-buffet-cb:checked').forEach(cb => {
      if (buffetGuests <= 0) return;
      const dish = getDish(cb.value);
      if (!dish) return;
      (dish.ingredients || []).forEach(ing => {
        addIngredient(ing.goodId, ing.brutto * buffetGuests);
      });
    });

    // 3. Staff питание (Берем все блюда на конкретный день и неделю)
    if (staffPeople > 0 && DB.staffMenu && DB.staffMenu.weeks) {
      const weekData = DB.staffMenu.weeks[staffWeek - 1];
      const dayData = weekData ? weekData.days[staffDay] : null;
      
      if (dayData) {
        ['breakfast', 'lunch', 'dinner'].forEach(meal => {
          const ids = dayData.meals[meal] || [];
          ids.forEach(id => {
            const dish = DB.staffDishes.find(d => d.id === id);
            if (!dish) return;
            (dish.ingredients || []).forEach(ing => {
              addIngredient(ing.goodId, ing.brutto * staffPeople);
            });
          });
        });
      }
    }

    // 4. Вычитаем текущие остатки и формируем итоговый список
    const result = [];
    let totalSum = 0;

    Object.keys(needs).forEach(goodId => {
      const good = getGood(goodId);
      if (!good) return;
      
      const requiredQty = round3(needs[goodId]);
      const stockQty = currentStock(goodId);
      
      // Нужно заказать (если остаток больше нуля, он вычитается)
      const orderQty = round3(Math.max(0, requiredQty - stockQty));
      
      if (orderQty > 0) {
        const price = avgPrice(good);
        const sum = orderQty * price;
        totalSum += sum;
        result.push({
          goodId, name: good.name, unit: good.unit,
          required: requiredQty, stock: stockQty, orderQty, price, sum
        });
      }
    });

    result.sort((a, b) => b.sum - a.sum); // Сортируем по убыванию стоимости
    showCalculationResult(result, totalSum);
  }

  function showCalculationResult(items, totalSum) {
    let rows = '';
    items.forEach(it => {
      rows += `<tr>
        <td>${esc(it.name)}</td>
        <td class="col-center">${esc(it.unit)}</td>
        <td class="col-right" style="color:var(--text-muted);">${fmt3(it.stock)}</td>
        <td class="col-right" style="color:var(--accent-orange); font-weight:bold;">${fmt3(it.orderQty)}</td>
        <td class="col-right">${fmt2(it.price)} ₽</td>
        <td class="col-right" style="font-weight:bold;">${fmt2(it.sum)} ₽</td>
      </tr>`;
    });

    const html = `
      <div style="max-height:500px; overflow-y:auto;">
        <table class="price-grid">
          <thead>
            <tr>
              <th>Товар</th>
              <th class="col-center" style="width:60px;">Ед.</th>
              <th class="col-right" style="width:100px;">На складе</th>
              <th class="col-right" style="width:100px; color:var(--accent-orange);">Заказать</th>
              <th class="col-right" style="width:100px;">Средняя цена</th>
              <th class="col-right" style="width:120px;">Сумма</th>
            </tr>
          </thead>
          <tbody>${rows || `<tr><td colspan="6" class="empty-state">Всего хватает на складе! Заявка не нужна.</td></tr>`}</tbody>
        </table>
      </div>
      <div style="text-align:right; font-size:18px; font-weight:bold; margin-top:16px; padding:12px; background:var(--bg-panel); border-radius:6px; border:1px solid var(--border);">
        Итого к заказу: <span style="color:var(--accent-orange);">${fmt2(totalSum)} ₽</span>
      </div>
    `;

    openModal({
      title: '📋 Потребность в товарах',
      html: html,
      xwide: true,
      okLabel: 'Сохранить как Заявку',
      okDanger: false,
      onSubmit: () => {
        if (items.length === 0) { closeModal(); return; }
        
        // Сохраняем в базу
        if (!DB.requisitions) DB.requisitions = [];
        
        const invNumber = (DB.requisitions.length > 0 ? Math.max(...DB.requisitions.map(i => i.number || 0)) : 0) + 1;
        
        DB.requisitions.push({
          id: uid('req'),
          number: invNumber,
          date: todayISO(),
          items: items,
          total: totalSum,
          createdAt: new Date().toISOString()
        });
        
        saveDB(true);
        toast('Заявка №' + invNumber + ' сохранена!', 'success');
        closeModal();
      }
    });
  }

  // ==================== 2. ИСТОРИЯ ЗАЯВОК ====================
  function openRequisitionHistoryModal() {
    const reqs = (DB.requisitions || []).slice().sort((a, b) => b.createdAt.localeCompare(a.createdAt));
    
    let rows = '';
    reqs.forEach(r => {
      const dateStr = new Date(r.createdAt).toLocaleString('ru-RU');
      rows += `<tr>
        <td class="col-center">№${r.number}</td>
        <td>${dateStr}</td>
        <td class="col-center">${r.items.length}</td>
        <td class="col-right" style="font-weight:bold; color:var(--active-text);">${fmt2(r.total)} ₽</td>
        <td class="col-center">
          <button class="row-btn" data-view-req="${r.id}" title="Просмотр">👁</button>
          <button class="row-btn" data-print-req="${r.id}" title="Печать">🖨</button>
        </td>
      </tr>`;
    });

    const html = `
      <div style="max-height:500px; overflow-y:auto;">
        <table class="price-grid">
          <thead>
            <tr>
              <th class="col-center" style="width:80px;">Номер</th>
              <th>Дата</th>
              <th class="col-center" style="width:80px;">Позиций</th>
              <th class="col-right" style="width:120px;">Сумма</th>
              <th class="col-center" style="width:100px;">Действия</th>
            </tr>
          </thead>
          <tbody>${rows || `<tr><td colspan="5" class="empty-state">Заявок пока нет.</td></tr>`}</tbody>
        </table>
      </div>
    `;

    openModal({
      title: '📋 История заявок',
      html: html,
      wide: true,
      okLabel: 'Закрыть',
      onSubmit: closeModal
    });

    setTimeout(() => {
      document.querySelectorAll('[data-view-req]').forEach(btn => {
        btn.addEventListener('click', () => {
          const req = DB.requisitions.find(x => x.id === btn.dataset.viewReq);
          if (req) openRequisitionDetailModal(req);
        });
      });
      document.querySelectorAll('[data-print-req]').forEach(btn => {
        btn.addEventListener('click', () => {
          const req = DB.requisitions.find(x => x.id === btn.dataset.printReq);
          if (req) printRequisition(req);
        });
      });
    }, 50);
  }

  // ==================== 3. ПРОСМОТР ДЕТАЛЕЙ ЗАЯВКИ ====================
  function openRequisitionDetailModal(req) {
    let rows = '';
    req.items.forEach(it => {
      rows += `<tr>
        <td>${esc(it.name)}</td>
        <td class="col-center">${esc(it.unit)}</td>
        <td class="col-right" style="color:var(--text-muted);">${fmt3(it.stock)}</td>
        <td class="col-right" style="color:var(--accent-orange); font-weight:bold;">${fmt3(it.orderQty)}</td>
        <td class="col-right">${fmt2(it.price)} ₽</td>
        <td class="col-right" style="font-weight:bold;">${fmt2(it.sum)} ₽</td>
      </tr>`;
    });

    const html = `
      <div style="margin-bottom:16px; font-weight:bold; color:var(--active-text);">
        Заявка №${req.number} от ${new Date(req.createdAt).toLocaleDateString('ru-RU')}
      </div>
      <div style="max-height:500px; overflow-y:auto;">
        <table class="price-grid">
          <thead>
            <tr>
              <th>Товар</th>
              <th class="col-center" style="width:60px;">Ед.</th>
              <th class="col-right" style="width:100px;">На складе</th>
              <th class="col-right" style="width:100px; color:var(--accent-orange);">Заказать</th>
              <th class="col-right" style="width:100px;">Средняя цена</th>
              <th class="col-right" style="width:120px;">Сумма</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div style="text-align:right; font-size:18px; font-weight:bold; margin-top:16px; padding:12px; background:var(--bg-panel); border-radius:6px; border:1px solid var(--border);">
        Итого к заказу: <span style="color:var(--accent-orange);">${fmt2(req.total)} ₽</span>
      </div>
    `;

    openModal({
      title: 'Просмотр заявки',
      html: html,
      xwide: true,
      okLabel: 'Закрыть',
      onSubmit: closeModal
    });
  }

  // ==================== 4. ПЕЧАТЬ ЗАЯВКИ ====================
  function printRequisition(req) {
    const dateStr = new Date(req.createdAt).toLocaleDateString('ru-RU');
    let rows = '';
    req.items.forEach((it, i) => {
      rows += `<tr>
        <td style="text-align:center;">${i+1}</td>
        <td>${esc(it.name)}</td>
        <td style="text-align:center;">${esc(it.unit)}</td>
        <td style="text-align:right;">${fmt3(it.orderQty)}</td>
        <td style="text-align:right;">${fmt2(it.price)} ₽</td>
        <td style="text-align:right;">${fmt2(it.sum)} ₽</td>
      </tr>`;
    });

    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Заявка №${req.number}</title>
    <style>
      @page { size: A4 portrait; margin: 15mm; }
      body { font-family: 'Times New Roman', serif; font-size: 12px; color: #000; }
      .header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #000; padding-bottom: 10px; }
      .header h1 { font-size: 16px; margin: 0; text-transform: uppercase; }
      .meta { margin-bottom: 15px; font-size: 13px; line-height: 1.5; display: flex; justify-content: space-between; }
      table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
      th, td { border: 1px solid #000; padding: 6px 8px; font-size: 12px; }
      th { background: #f0f0f0; text-align: center; font-weight: bold; }
      .signs { display: flex; justify-content: space-between; margin-top: 30px; font-size: 13px; }
      .sign-block { width: 45%; }
      .line { border-bottom: 1px solid #000; height: 20px; margin-top: 15px; }
      .hint { font-size: 10px; color: #555; text-align: center; }
    </style></head><body>
    <div class="header">
      <h1>Заявка на закупку</h1>
      <h2>№ ${req.number} от ${dateStr}</h2>
    </div>
    <div class="meta">
      <div><b>Организация:</b> ООО «A_Chef Restaurant Group»</div>
      <div><b>Позиций:</b> ${req.items.length}</div>
    </div>
    <table>
      <thead>
        <tr>
          <th style="width: 40px;">№</th>
          <th>Наименование товара</th>
          <th style="width: 60px;">Ед.</th>
          <th style="width: 100px;">Кол-во</th>
          <th style="width: 100px;">Цена, ₽</th>
          <th style="width: 120px;">Сумма, ₽</th>
        </tr>
      </thead>
      <tbody>
        ${rows}
        <tr>
          <td colspan="5" style="text-align: right; font-weight: bold; font-size: 14px;">ИТОГО:</td>
          <td style="text-align: right; font-weight: bold; font-size: 14px;">${fmt2(req.total)} ₽</td>
        </tr>
      </tbody>
    </table>
    <div class="signs">
      <div class="sign-block">
        <b>Составил:</b>
        <div class="line"></div>
        <div class="hint">(должность / подпись / Ф.И.О.)</div>
      </div>
      <div class="sign-block">
        <b>Утверждаю:</b>
        <div class="line"></div>
        <div class="hint">(должность / подпись / Ф.И.О.)</div>
      </div>
    </div>
    </body></html>`;

    const w = window.open('', '_blank');
    if(!w) { toast('Разрешите всплывающие окна для печати', 'error'); return; }
    w.document.write(html);
    w.document.close();
    setTimeout(() => { w.focus(); w.print(); }, 400);
  }

})();


</script>
